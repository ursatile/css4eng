<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>border-radius</title>
	<style>
		* {
			box-sizing: border-box;
			text-align: center;
			font-family: Consolas, 'Courier New', Courier, monospace;
		}

		section {
			&:nth-of-type(1) div { border-radius: 25%; }
			&:nth-of-type(2) div { border-radius: 50%; }
			&:nth-of-type(3) div { border-radius: 100% 0; }
			&:nth-of-type(4) div { border-radius: 100% 0 0 0; }
			div {
				padding: 3vw;
				height: 8vw;
			}

			div:nth-of-type(1) {
				width: 50vw;
			}

			div:nth-of-type(2) {
				width: 20vw;
			}

			div:nth-of-type(3) {
				width: 6vw;
			}

			div:nth-of-type(4) {
				width: 5vw;
			}
		}

		div {
			font-size: 0.75rem;
			border: 2px solid royalblue;
			background-color: gold;
			display: inline-block;
			margin: 5px;
		}
	</style>
</head>
<body>
	<section>
		<div>25%;</div>
		<div>&nbsp;</div>
		<div>&nbsp;</div>
		<div>&nbsp;</div>
	</section>
	<section>
		<div>50%;</div>
		<div>&nbsp;</div>
		<div>&nbsp;</div>
		<div>&nbsp;</div>
	</section>
	<section>
		<div>100% 0;</div>
		<div>&nbsp;</div>
		<div>&nbsp;</div>
		<div>&nbsp;</div>
	</section>
	<section>
		<div>100% 0 0 0;</div>
		<div>&nbsp;</div>
		<div>&nbsp;</div>
		<div>&nbsp;</div>
	</section>

</body>
</html>
