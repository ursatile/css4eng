<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Radio Buttons Inside Labels</title>
</head>
<body>
	<fieldset>
		<legend>Favourite Member of The Police</legend>
		<input type="radio" name="the-police" value="sting" id="the-police-sting">
		<label for="the-police-sting">Sting</label>
		<input type="radio" name="the-police" value="stewart"
			id="the-police-stewart">
		<label for="the-police-stewart">Stewart Copeland</label>
		<input type="radio" name="the-police" value="andy" id="the-police-andy">
		<label for="the-police-andy">Andy Summers</label>
	</fieldset>
</body>
</html>
