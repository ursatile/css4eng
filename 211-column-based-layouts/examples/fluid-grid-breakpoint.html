<!DOCTYPE html>
<html lang="en">
<head>
	<title>960 Grid Using Floats</title>
	<link rel="stylesheet" href="fluid-grid.css">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
		.container {
			background: repeating-linear-gradient(to right,
					#ccf 0 1%,
					#ffc 1% 7.3333%,
					#ccf 7.3333% 8.3333%);
		}

		@media (width < 600px) {
			.container {
				background: linear-gradient(to right,
						#ccf 0 10px,
						#ffc 10px calc(100% - 10px),
						#ccf calc(100% - 10px) 100%);
				width: 100%;
				padding: 0 10px;
			}

			[class*="col-"] {
				float: none;
				width: 100%;
				margin-left: 0;
			}
		}

		[class*="col-"] {
			margin-top: 10px;
			padding: 2px;
			font-family: Consolas;
			text-align: center;
			background-color: #999;
			font-size: 12px;
		}
	</style>
</head>
<body>
	<div class="container">
		<div class="row">
			<div class="col-1">1</div>
			<div class="col-1">1</div>
			<div class="col-1">1</div>
			<div class="col-1">1</div>
			<div class="col-1">1</div>
			<div class="col-1">1</div>
			<div class="col-1">1</div>
			<div class="col-1">1</div>
			<div class="col-1">1</div>
			<div class="col-1">1</div>
			<div class="col-1">1</div>
			<div class="col-1">1</div>
		</div>
		<div class="row">
			<div class="col-3">col-3</div>
			<div class="col-3">col-3</div>
			<div class="col-3">col-3</div>
			<div class="col-3">col-3</div>
		</div>

		<div class="row">
			<div class="col-4">col-4</div>
			<div class="col-4">col-4</div>
			<div class="col-4">col-4</div>
		</div>
		<div class="row">
			<div class="col-6">col-6</div>
			<div class="col-6">col-6</div>
		</div>
		<div class="row">
			<div class="col-12">col-12</div>
		</div>
		<div class="row">
			<div class="col-1">1</div>
			<div class="col-11">col-11</div>
		</div>
		<div class="row">
			<div class="col-2">col-2</div>
			<div class="col-10">col-10</div>
		</div>
		<div class="row">
			<div class="col-3">col-3</div>
			<div class="col-9">col-9</div>
		</div>
		<div class="row">
			<div class="col-4">col-4</div>
			<div class="col-8">col-8</div>
		</div>
		<div class="row">
			<div class="col-5">col-5</div>
			<div class="col-7">col-7</div>
		</div>
	</div>
</body>
</html>
