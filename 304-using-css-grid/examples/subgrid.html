<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Subgrid</title>
	<style>
		section {
			font-size: 1.2vw;
			width: 40vw;
			aspect-ratio: 1;
			display: grid;
			grid-template-columns: 1fr 2fr 3fr 4fr 1fr;
			grid-template-rows: 1fr 2fr 3fr 4fr 1fr;
			gap: 5px;

			div {
				background-color: crimson;
				padding: 5px;
				grid-column: span 3;
				grid-row: span 3;
				display: grid;
				grid-template-columns: 2fr 3fr 4fr;
				grid-template-rows: 2fr 3fr 4fr;
				gap: 10px;

				&.subgrid {
					grid-template-columns: subgrid;
					grid-template-rows: subgrid;
				}
			}
		}
	</style>
	<style>
		body {
			display: flex;
			justify-content: space-around;
			gap: 20px;
		}

		section {
			background-color: royalblue;
			padding: 5px;

			span {
				background-color: gold;
				padding: 10px;
				font-family: Consolas, 'Courier New', Courier, monospace;
				text-align: center;
				display: flex;
				align-items: center;
				justify-content: center;
			}

			counter-reset: grid-item;

			>span {
				counter-increment: grid-item;

				&::before { content: counter(grid-item); }
			}
		}
	</style>
</head>
<body>
	<section>
		<span></span><span></span><span></span><span></span><span></span>
		<span></span>
		<div>
			<span>Alice Cooper</span>
			<span>Bon Jovi</span>
			<span>Creedence Clearwater Revival</span>

			<span>Dire Straits</span>
			<span>Eagles</span>
			<span>Foo Fighters</span>

			<span>Galahad</span>
			<span>Heart</span>
			<span>Iron Maiden</span>
		</div>
		<span></span>
		<span></span><span></span>
		<span></span><span></span>
		<span></span><span></span><span></span><span></span><span></span>
	</section>

	<section>
		<span></span><span></span><span></span><span></span><span></span>
		<span></span>
		<div class="subgrid">
			<span>Alice Cooper</span>
			<span>Bon Jovi</span>
			<span>Creedence Clearwater Revival</span>

			<span>Dire Straits</span>
			<span>Eagles</span>
			<span>Foo Fighters</span>

			<span>Galahad</span>
			<span>Heart</span>
			<span>Iron Maiden</span>
		</div>
		<span></span>
		<span></span><span></span>
		<span></span><span></span>
		<span></span><span></span><span></span><span></span><span></span>
	</section>


</body>
</html>
