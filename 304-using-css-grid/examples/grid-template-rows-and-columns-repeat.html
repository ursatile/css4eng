<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Grid Template Rows And Columns</title>
	<style>
		section {

			display: grid;
			grid-template-rows: repeat(4, 1fr);
			grid-template-columns: 3fr repeat(5,1fr) 3fr;
			gap: 10px;

			height: 20rem;
			padding: 10px;
			background-color: royalblue;

			div { background-color: gold; }
		}
	</style>
	<style>
		section {
			counter-reset: grid-item;

			div {
				font-family: Consolas, 'Courier New', Courier, monospace;
				text-align: center;
				counter-increment: grid-item;
				display: flex;
				align-items: center;
				justify-content: center;

				&::before { content: counter(grid-item); }
			}
		}
	</style>
</head>
<body>
	<section>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
	</section>
</body>
</html>
