<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CSS Grid Named Columns</title>
	<style>
		body {
			display: grid;
			gap: 10px;
			grid-template-columns:
				[nav-start] 180px [nav-end main-start] 1fr [main-end ads-start] 180px [ads-end];

			nav {
				grid-column-start: nav-start;
				grid-column-end: nav-end;
			}

			main {
				grid-column-start: main-start;
				grid-column-end: main-end;
			}

			aside#adverts {
				grid-column-start: ads-start;
				grid-column-end: ads-end;
			}
		}
	</style>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {

			height: 100vh;
			max-width: 960px;
			margin: 0px auto;
			padding: 20px;

			>* {
				background-color: silver;
				display: flex;
				justify-content: center;
				align-items: center;
				font-family: Consolas, 'Courier New', Courier, monospace;
			}
		}
	</style>
</head>
<body>
	<nav>
		nav
	</nav>
	<main>
		main
	</main>
	<aside id="adverts">
		adverts
	</aside>
</body>
</html>
