<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Grid Template Auto</title>
	<style>
		section {
			display: grid;
			grid-template-columns: auto;
			grid-template-rows: 1fr 1fr;
		}
	</style>
	<style>
		body {
			height: 20rem;
			overflow-y: scroll;
		}

		section {
			gap: 10px;
			padding: 10px;
			height: 15rem;
			background-color: royalblue;

			div {
				background-color: gold;
				padding: 20px;
			}

			counter-reset: grid-item;

			div {
				font-family: Consolas, 'Courier New', Courier, monospace;
				text-align: center;
				counter-increment: grid-item;
				display: flex;
				align-items: center;
				justify-content: center;

				&::before { content: counter(grid-item); }
			}
		}

		pre { text-align: center; }

		button {
			background-color: gold;
			border: none;
			border-radius: 20px;
			padding: 10px;
			margin-bottom: 10px;
			cursor: pointer;

			&:nth-of-type(2) { float: right; }
		}
	</style>
</head>
<body>
	<button id="add-an-element-button" href="#">add an element</button>
	<button id="reset-button" href="#">reset</button>
	<section>
	</section>
</body>
<script>
	document.getElementById("add-an-element-button").addEventListener("click", () => {
		const div = document.createElement('div');
		document.querySelector("section").appendChild(div);
		return false;
	});
	document.getElementById("reset-button").addEventListener("click", () => {
		document.querySelector("section").innerHTML = '';
	});
	window.setInterval(() => {
				const div = document.createElement('div');
		document.querySelector("section").appendChild(div);
	}, 500);



</script>
</html>
