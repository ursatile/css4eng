<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Pink Floyd: The Dark Side Of The Moon</title>
	<style>
		* {
			box-sizing: border-box;
		}
		html {
			background-color: white;
			background-image: url(Pink-Floyd-Dark-Side-of-the-Moon.webp);
			background-size: 80vw 80vw;
			background-repeat: no-repeat;
			background-position: 10vw center;
		}

		body {
			opacity: 1;
			margin: 10vw auto;
			width: 80vw;
			height: 80vw;
			display: flex;
			align-items: center;
			justify-content: center;
			background-image:
				linear-gradient(-14.2deg, #0000 0 49.9vw, white 49.9vw 50.4vw, #0000 50.4vw),
				conic-gradient(from 0deg at -40vw 20.4vw,
					#0000 0deg 98.8deg,
					#f01d24 98.8deg 99.8deg,
					#f58c30 99.8deg 100.7deg,
					#e9e22f 100.7deg 101.6deg,
					#8acc39 101.6deg 102.5deg,
					#67b1f7 102.5deg 103.3deg,
					#6e69af 103.3deg 104.1deg,
					#0000 104.1deg),
					linear-gradient(black);

			background-size: 40vw 80vw, 40vw 80vw, 80vw 80vw;
			background-position: 0 0, 40vw 0;
			background-repeat: no-repeat, no-repeat;

			div {
				position: relative;
				top: -9vw;
				width: 0vw;
				height: 0vw;
				border-width: 0 12.5vw 22vw 12.5vw;
				border-style: solid;
				border-color: transparent transparent rgb(212, 220, 247) transparent;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: flex-start;

				&::before {
					border-width: 0 11vw 21vw 11vw;
					position: relative;
					top: 0.5vw;
					border-style: solid;
					border-color: transparent transparent #012 transparent;
					content: ' ';
					filter: blur(8px);
				}
			}

			&::before {
				content: ' ';
				width: 16vw;
				height: 19.2vw;
				position: absolute;
				top: 30vw;
				z-index: 2;
				background-image:
					conic-gradient(from 0deg at 1vw 9.75vw,
						#000 0deg 77deg,
						#fff 77deg 99.7deg,
						#000 98deg 0deg
					),
					conic-gradient(from 0deg at 8vw -0.2vw,
						#000 0deg 150deg,
						#999 151deg,
						#111 160deg 170deg,
						#ccc 210deg,
						#000 210deg 270deg);
				background-blend-mode: multiply;
				mix-blend-mode: screen;
			}
		}
	</style>
</head>
<body>
	<div></div>
</body>
</html>
