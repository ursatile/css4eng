<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Hot Space</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Mr+Dafoe&display=swap');
		@import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wdth,wght@0,75..100,100..900;1,75..100,100..900&display=swap');

		article {
			display: grid;
			grid-template-rows: 1fr 1fr;
			grid-template-columns: 1fr 1fr;
			width: 400px;
			height: 400px;
			margin: 1em auto;
			background: conic-gradient(#25b5ee 0deg 90deg, yellow 90deg 180deg, rgb(55, 145, 55) 180deg 270deg, red 270deg 360deg);

			h1 {
				position: absolute;
				margin: 0;
				top: 30px;
				text-align: center;
				left: 0;
				right: 0;
				font-family: "Roboto", sans-serif;
				font-optical-sizing: auto;
				font-style: normal;
				font-weight: 900;
				font-size:200%;
				letter-spacing: -0.02em;
				font-variation-settings:
					"wdth" 75;
					color: #fff;
			}

			h2 {
				position: absolute;
				left: 0;
				right: 0;
				top: 50px;
				color: #fff;
				text-align: center;
				font-size: 200%;
				transform: rotate(-15deg);
				text-align: center;
				font-family: "Mr Dafoe", cursive;
				font-weight: 400;
				line-height: 0.8em;
				font-style: normal;
			}
		}

		section {
			div {
				width: 100%;
				height: 100%;
			}
		}

		section:first-child {
			background-color: #929;

			div {
				background: radial-gradient(#fff0 0 30%, white 50%) center center / 100% 180% no-repeat,
					url(https://dylanbeattie.net/miscellany/images/eric-meyer.jpg) center top -40px / 120% no-repeat;
				filter: brightness(0.9) contrast(100) saturate(0) contrast(100) invert();
				mix-blend-mode: multiply;
			}

			mix-blend-mode: difference;
		}

		section:nth-child(2) {
			background-color:#FF70EE;

			div {
				background: radial-gradient(#fff0 0 30%, white 50%) center left 0px / 120% 160% no-repeat,
					url(https://dylanbeattie.net/miscellany/images/sara-souiedan.jpg) center / 100% no-repeat;
				filter: brightness(0.9) contrast(100) saturate(0) contrast(100) invert();
				mix-blend-mode: multiply;
			}

			mix-blend-mode: difference;
		}

		section:nth-child(3) {
			background-color: rgb(255, 236, 216);

			div {
				background: radial-gradient(#fff0 0 30%, white 50%) center left 0px / 120% 180% no-repeat,
					url(https://dylanbeattie.net/miscellany/images/hakon-lie.jpg) center / 100% no-repeat;
				filter: brightness(1.3) contrast(70) saturate(0) contrast(80) invert();
				mix-blend-mode: multiply;
			}

			mix-blend-mode: difference;
		}

		section:nth-child(4) {
			background-color: grey;

			div {
				background: radial-gradient(#fff0 0 30%, white 50%) center left 0px / 120% 180% no-repeat,
					url(https://dylanbeattie.net/miscellany/images/sarah-drasner.jpg) center / 100% no-repeat;
				filter: brightness(1.3) contrast(70) saturate(0) contrast(80) invert();
				mix-blend-mode: multiply;
			}

			mix-blend-mode: difference;
		}
	</style>
</head>
<body>
	<article>
		<section>
			<div></div>
		</section>
		<section>
			<div></div>
		</section>
		<section>
			<div></div>
		</section>
		<section>
			<div></div>
		</section>
		<h1>SCREEN</h1>
		<h2>Web<br>Space</h2>
	</article>


</body>
</html>
