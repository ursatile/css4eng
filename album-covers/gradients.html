<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		* { box-sizing: border-box; }
		body {
			display: flex;
			flex-wrap: wrap;
		}
		div {
			width: 0px;
			height: 0px;
			border-width: 0px 100px 141px 100px;
			border-color: red transparent yellow transparent;
			border-style: solid;
			position: relative;
			display: flex;
			align-items: center;
			justify-content: center;
			&::after {
				content: 'H';
				position: relative;
				top: 10vw;
				border-width: 0px 80px 121px 80px;
				border-color: red transparent black transparent;
			}
		}
	</style>
</head>
<body>
	<div></div>
</body>
</html>
