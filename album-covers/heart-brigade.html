<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta http-equiv="X-UA-Compatible" content="ie=edge" />
	<title>Heart - Brigade</title>
	<style>
		@import url("https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght,XOPQ,XTRA,YOPQ@8..144,25..151,100..1000,27..175,323..603,25..135&display=swap");

		* {
			box-sizing: border-box;
		}

		html {
			background-color: white;
			font-family: "Roboto Flex", sans-serif;

		}

		body {
			/* &:hover::after {
				content: ' ';
				width: 80vw;
				height: 80vw;
				background: magenta;
				display: block;
				position: absolute;
				top: 0;
				left: 0;
				background-image: url(heart-brigade.jpg);
				background-size: cover;
			} */

			overflow: hidden;
			width: 80vw;
			height: 80vw;
			margin: 10vw auto;
			background: black;
			position: relative;

			&::before {
				position: absolute;
				background-color: #1d509b;
				right: 0;
				top: 0;
				content: ' ';
				width: 27vw;
				height: 3.5vw;
			}
			&::after {
				position: absolute;
				background-color: #cd3328;
				left: 0;
				bottom: 0;
				content: ' ';
				width: 25.5vw;
				height: 3.7vw;
			}

			div:first-child {
				text-transform: uppercase;
				background-color: #d79503;
				width: 25.5vw;
				height: 12.8vw;
				padding-left: 0.2vw;
				padding-top: 0.2vw;
				border-top: 4.4vw solid black;
				overflow: hidden;
				&::after {
					content: ' ';
					width: 39vw;
					height: 39vw;
					position: absolute;
					right: 7.5vw;
					top: 21vw;
					font-weight: 900;
					display: block;
					font-variation-settings: "wdth" 130,
					"XOPQ" 100,
					"XTRA" 470,
					"YOPQ" 120,
					"YTAS" 20,
					"YTUC" 10;
					font-size: 50vw;
					background-image:
						repeating-conic-gradient(black 0deg 90deg,
							white 90deg 360deg),
					linear-gradient(-45deg,
					#cd3328 0 50%, #1d509b 50%);
					background-size: 67% 67%, 100%;
					background-position: -1px -1px, center;
					background-blend-mode: darken;
					transform: rotate(-45deg);
					color: transparent;
				}

				span {
					display:inline-block;
					/* transform: scale(1,1.05); */
					font-size: calc(8vw - (0.9vw * sibling-index()));
					font-weight: 700;
					letter-spacing: 2.7vw;
					font-variation-settings:
						"wdth" 15;

					&:first-child {
						font-variation-settings:
							"wdth" 50;
					}

					&:last-child {
						letter-spacing: 0;
					}
				}
			}

			div:last-child {
				position: absolute;
				bottom: 2.2vw;
				right: -0.5vw;
				font-size: 1.9vw;
				font-weight: 600;
				color: #d79503;
				text-transform: uppercase;
				letter-spacing: 3vw;
				font-variation-settings:
					"wdth" 15;
				transform: scale(1, 1.2);
			}
		}
	</style>
</head>
<body>
	<div>
		<span>h</span>
		<span>e</span>
		<span>a</span>
		<span>r</span>
		<span>t</span>
	</div>
	<div>brigade</div>
</body>
</html>
