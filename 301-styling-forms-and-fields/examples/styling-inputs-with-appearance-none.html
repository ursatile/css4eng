<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Styling Inputs With Appearance None</title>
	<style>
		fieldset {
			border: 2px solid black;
			border-radius: 5px;
			margin-bottom: 20px;
		}

		input[type="radio"],
		input[type="checkbox"] {
			 /* the elements don't have a color per se, but the value
			 set here determines the value of currentcolor for styling */
			color: orangered;
			appearance: none;
			width: 20px;
			height: 20px;
			border: 2px solid black;
			display: inline-grid;
			place-content: center;
			translate: 0 -1px;

			&:focus { outline: 1px solid silver; }
			&::before { transition: scale 0.2s; }
			&:disabled { border-color: #ccc; background-color: #eee; }

			&:checked {
				border-color: currentcolor;

				&::before { scale: 1; }
			}
		}

		input[type="checkbox"] {
			border-radius: 2px;

			&::before {
				content: "✔";
				font-weight: 900;
				font-size: 1.2em;
				scale: 0;
				position: relative;
				top: -1px;
			}
		}

		input[type="radio"] {
			border-radius: 12px;

			&::before {
				content: "";
				width: 9px;
				height: 9px;
				/* use box-shadow here because background-color doesn't print */
				box-shadow: inset 10px 10px currentColor;
				border-radius: 1rem;
				scale: 0;
			}
		}
	</style>
</head>
<body>
	<fieldset>
		<legend>Favourite Queen Member</legend>
		<label>
			<input type="radio" name="queen" value="fm"> Freddie Mercury
		</label>
		<label>
			<input type="radio" name="queen" value="bm" checked> Brian May
		</label>
		<label>
			<input type="radio" name="queen" value="jd"> John Deacon
		</label>
		<label>
			<input type="radio" name="queen" value="rt"> Roger Taylor
		</label>
		<label>
			<input type="radio" name="queen" value="se" disabled> Spike Edney
		</label>
	</fieldset>
	<fieldset>
		<legend>Which Queen Albums Do You Own?</legend>
		<label>
			<input type="checkbox" name="albums" value="queen"> Queen
		</label>
		<label>
			<input type="checkbox" name="albums" value="queen-ii"> Queen II
		</label>
		<label>
			<input type="checkbox" name="albums" value="Jazz">
			Jazz
		</label>
		<label>
			<input type="checkbox" name="albums" value="Hot Space" checked>
			Hot Space
		</label>
		<label>
			<input type="checkbox" name="albums" value="mr-bad-guy" disabled>
			Mr. Bad Guy
		</label>
	</fieldset>
</body>
</html>
