<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Select With All The Extra Toppings</title>
	<style>
		* { box-sizing: border-box; }

		select,
		::picker(select) { appearance: base-select; }
		img { width: 200px; }

		select {
			border-radius: 10px;
			border: 2px solid #000;
			background-color: black;
			color: white;
			span { display: none; }

			&::picker-icon { display: none; }
			button selectedcontent { padding: 10px; }

			&:open {
				&::picker(select) {
					display: grid;
					grid: repeat(4, 1fr) / repeat(4, 1fr);
					cursor: pointer;
					border-radius: 10px;
					padding: 10px;
					gap: 5px;
					background-color: black;
				}
			}

			option {
				border: 2px solid #000;
				border-radius: 5px;
				padding: 5px;
				display: block;
				display: grid;
				place-content: center;

				img {
					width: 100px;
					padding: 0;
					margin: 5px;
				}
			}

			option::checkmark { display: none; }
			option:checked { border: 2px solid #fff; }
		}
	</style>
</head>
<body>
	<select>
		<button>
			<selectedcontent></selectedcontent>
		</button>
		<option value="acdc-back-in-black">
			<img src="album-covers/acdc-back-in-black.jpg" alt="AC/DC - Back in Black">
			<span>AC/DC - Back in Black</span>
		</option>
		<option value="blondie-blondie">
			<img src="album-covers/blondie-blondie.jpg" alt="Blondie - Blondie">
			<span>Blondie - Blondie</span>
		</option>
		<option value="bon-jovi-slippery-when-wet">
			<img src="album-covers/bon-jovi-slippery-when-wet.jpg"
				alt="Bon Jovi - Slippery When Wet">
			<span>Bon Jovi - Slippery When Wet</span>
		</option>
		<option value="bruce-springsteen-born-in-the-usa">
			<img src="album-covers/bruce-springsteen-born-in-the-usa.jpg"
				alt="Bruce Springsteen - Born in the USA">
			<span>Bruce Springsteen - Born in the USA</span>
		</option>
		<option value="david-bowie-heroes">
			<img src="album-covers/david-bowie-heroes.jpg" alt="David Bowie - Heroes">
			<span>David Bowie - Heroes</span>
		</option>
		<option value="don-mclean-american-pie">
			<img src="album-covers/don-mclean-american-pie.jpg"
				alt="Don McLean - American Pie">
			<span>Don McLean - American Pie</span>
		</option>
		<option value="duran-duran-rio">
			<img src="album-covers/duran-duran-rio.jpg" alt="Duran Duran - Rio">
			<span>Duran Duran - Rio</span>
		</option>
		<option value="electric-light-orchestra-time">
			<img src="album-covers/electric-light-orchestra-time.jpg" alt="Electric Light Orchestra - Time">
			<span>Electric Light Orchestra - Time</span>
		</option>
		<option value="magnum-wings-of-heave">
			<img src="album-covers/magnum-wings-of-heaven.jpg" alt="Magnum - Wings of Heaven">
			<span>Magnum - Wings of Heaven</span>
		</option>
		<option value="marillion-brave" selected>
			<img src="album-covers/marillion-brave.jpg" alt="Marillion - Brave">
			<span>Marillion - Brave</span>
		</option>
		<option value="pearl-jam-ten">
			<img src="album-covers/pearl-jam-ten.jpg" alt="Pearl Jam - Ten">
			<span>Pearl Jam - Ten</span>
		</option>
		<option value="pink-floyd-the-dark-side-of-the-moon">
			<img src="album-covers/pink-floyd-the-dark-side-of-the-moon.jpg"
				alt="Pink Floyd - The Dark Side of the Moon">
			<span>Pink Floyd - The Dark Side of the Moon</span>
		</option>
		<option value="queensrÿche-empire">
			<img src="album-covers/queensrÿche-empire.jpg" alt="Queensrÿche - Empire">
			<span>Queensrÿche - Empire</span>
		</option>
		<option value="rem-automatic-for-the-people">
			<img src="album-covers/rem-automatic-for-the-people.jpg"
				alt="REM - Automatic for the People">
			<span>REM - Automatic for the People</span>
		</option>
		<option value="threshold-dead-reckoning">
			<img src="album-covers/threshold-dead-reckoning.jpg"
				alt="Threshold - Dead Reckoning">
			<span>Threshold - Dead Reckoning</span>
		</option>
		<option value="van-halen-5150">
			<img src="album-covers/van-halen-5150.jpg" alt="Van Halen - 5150">
			<span>Van Halen - 5150</span>
		</option>
	</select>
</body>
</html>
