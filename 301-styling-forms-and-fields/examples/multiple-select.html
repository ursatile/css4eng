<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Multiple Select</title>
	<style>
		select {
			font-family: Arial, Helvetica, sans-serif;
			appearance: base-select;
			border-radius: 5px;
			border: 2px solid royalblue;
			background-color: gold;
			width: 12em;

			&::picker-icon {
				transition: all 0.5s;
				color: royalblue;
			}

			&:open {
				background: royalblue;
				color: white;
				border-radius: 5px 5px 0 0;

				&::picker-icon {
					color: white;
					transform: rotateX(0.5turn);
				}
			}

			&::picker(select) {
				appearance: base-select;
				border-style: solid;
				border-color: royalblue;
				border-width: 0 2px 2px 2px;
				border-radius: 0 0 5px 5px;
				background: gold;
			}

			option {
				border-top: 2px solid royalblue;

				&:first-of-type { border-top: none; }

				&:checked {
					background-color: royalblue;
					color: white;
				}

				&::checkmark { content: "▶"; }
			}
		}

	</style>
</head>
<body>
	<select size="8" multiple>
		<optgroup label="UK Bands">
			<option>Black Sabbath</option>
			<option>Def Leppard</option>
			<option selected>Iron Maiden</option>
			<option selected>Judas Priest</option>
			<option selected>Pink Floyd</option>
			<option>Thunder</option>
		</optgroup>
		<optgroup label="US Bands">
			<option>Alice in Chains</option>
			<option selected>Bon Jovi</option>
			<option>Cinderella</option>
			<option selected>Eagles</option>
			<option selected>Foreigner</option>
			<option>ZZ Top</option>
		</optgroup>
	</select>
</body>
</html>
