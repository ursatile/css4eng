<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Radio Buttons Inside Labels</title>
</head>
<body>
	<fieldset>
		<legend>Favourite Member of Rush</legend>
		<input type="radio" name="rush" value="neil"> Neil Peart
		<input type="radio" name="rush" value="alex"> Alex Lifeson
		<input type="radio" name="rush" value="geddy"> Geddy Lee
	</fieldset>
</body>
</html>
