<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Perspective</title>
	<style></style>
	<style>
		@import url('/styles/raleway.css');

		* { box-sizing: border-box; }

		body,
		html {
			margin: 0;
			padding: 0;
		}
		@keyframes zoom {
			0% { perspective: 0px; }
			50% { perspective: 100px; }
			100% { perspective: 0px; }
		}

		@keyframes spin {
			0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
			25% { transform: rotateX(0.5turn) rotateY(1turn) rotateZ(0.25turn); }
			50% { transform: rotateX(1turn) rotateY(2turn) rotateZ(0.5turn); }
			75% { transform: rotateX(1.5turn) rotateY(3turn) rotateZ(0.75turn); }
			100% { transform: rotateX(2turn) rotateY(4turn) rotateZ(1turn); }
		}
		body {
			width: 100vw;
			height: 100vh;
			min-height: 320px;
			display: flex;
			gap: 10px;
			padding: 10px;
			article {
				background-color: black;
				flex: 1 1 25vw;
				display: flex;
				align-items: center;
				justify-content: center;
				overflow: hidden;
				&::after {
					background: white;
					border-radius: 5px;
					padding: 5px;
					font-family: Consolas, 'Courier New', Courier, monospace;
					content: attr(style);
					position: absolute;
					bottom: 5px;
					left: 10px;
					right: 10px;
					text-align: center;
					transform: translateZ(0px);
				}

				&:hover {
					section { animation: spin 10s linear infinite; }
				}
				section {
					transform-origin: 50px 50px;
					transform-style: preserve-3d;
					position: relative;
					left: -50px;
					top: -50px;
					div {
						font-weight: bold;
						font-size: 1.2rem;
						position: absolute;
						top: 0px;
						left: 0px;
						width: 100px;
						height: 100px;
						border: 2px solid #000;
						border-radius: 10px;
						display: flex;
						align-items: center;
						justify-content: center;
					}
					div.front {
						background-color: hsl(0 100% 70% / 0.8);
						transform: translateZ(50px);
					}
					div.back {
						background-color: hsl(60 100% 70% / 0.8);
						transform: translateZ(-50px) rotateY(180deg);
					}
					div.left {
						background-color: hsl(120 100% 70% / 0.8);
						transform: translateX(-50px) rotateY(-90deg);
					}
					div.right {
						background-color: hsl(180 100% 70% / 0.8);
						transform: translateX(50px) rotateY(+90deg);
					}
					div.top {
						background-color: hsl(240 100% 70% / 0.8);
						transform: translateY(-50px) rotateX(+90deg);
					}
					div.bottom {
						background-color: hsl(300 100% 70% / 0.8);
						transform: translateY(50px) rotateX(-90deg);
					}
				}
			}
		}
	</style>
</head>
<body>
	<article style="perspective: 50px;">
		<section>
			<div class="front">FRONT</div>
			<div class="back">BACK</div>
			<div class="left">LEFT</div>
			<div class="right">RIGHT</div>
			<div class="top">TOP</div>
			<div class="bottom">BOTTOM</div>
		</section>
	</article>
	<article style="perspective: 100px;">
		<section>
			<div class="front">FRONT</div>
			<div class="back">BACK</div>
			<div class="left">LEFT</div>
			<div class="right">RIGHT</div>
			<div class="top">TOP</div>
			<div class="bottom">BOTTOM</div>
		</section>
	</article>
	<article style="perspective: 500px;">
		<section>
			<div class="front">FRONT</div>
			<div class="back">BACK</div>
			<div class="left">LEFT</div>
			<div class="right">RIGHT</div>
			<div class="top">TOP</div>
			<div class="bottom">BOTTOM</div>
		</section>
	</article>
	<article style="perspective: 5000px;">
		<section>
			<div class="front">FRONT</div>
			<div class="back">BACK</div>
			<div class="left">LEFT</div>
			<div class="right">RIGHT</div>
			<div class="top">TOP</div>
			<div class="bottom">BOTTOM</div>
		</section>
	</article>
</body>
</html>
