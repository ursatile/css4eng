<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>3d Transforms</title>
	<style>
		body {
			padding: 5vw;

			section:not(:last-of-type) { margin-bottom: 50px; }

			article {
				&:not(:last-of-type) { margin-bottom: 20px; }

				transform: none;
				flex: 1 1 30vw;
				height: 150px;
				background-color: black;
				display: flex;
				justify-content: space-around;
				gap: 10vw;
				padding: 20px;

				&:hover {
					div { transform: none !important; }
				}

				div {
					transform-style: preserve-3d;
					flex: 1 1 30%;
					transition: transform 1s;
					border: 2px solid black;
					border-radius: 10px;
					aspect-ratio: 1;
					display: flex;
					flex-direction: column;
					align-items: center;
					justify-content: center;
					font-family: Consolas, 'Courier New', Courier, monospace;
					aspect-ratio: 1;
					font-size: 4rem;

					pre { font-size: 0.8rem; }
					&:nth-of-type(1) { background-color: gold; }
					&:nth-of-type(2) { background-color: crimson; }
					&:nth-of-type(3) { background-color: royalblue; }
				}
			}
		}
	</style>
</head>
<body>
	<section>
		<pre>perspective: none;</pre>
		<article style="perspective: none;">
			<div style="transform: translateZ(-100px);">🐄</div>
			<div style="transform: translateZ(0px);"> 🐈</div>
			<div style="transform: translateZ(+100px);">🪿</div>
		</article>
		<pre>perspective: 100vw;</pre>
		<article style="perspective: 100vw;">
			<div style="transform: translateZ(-100px);">🐄</div>
			<div style="transform: translateZ(0px);"> 🐈</div>
			<div style="transform: translateZ(+100px);">🪿</div>
		</article>
	</section>
	<section>
		<pre>perspective: none;</pre>
		<article style="perspective: none;">
			<div style="transform: rotateX(60deg);">🐄</div>
			<div style="transform: rotateY(60deg);">🐈</div>
			<div style="transform: rotateZ(60deg);">🪿</div>
		</article>
		<pre>perspective: 100vw;</pre>
		<article style="perspective: 100vw;">
			<div style="transform: rotateX(60deg);">🐄</div>
			<div style="transform: rotateY(60deg);">🐈</div>
			<div style="transform: rotateZ(60deg);">🪿</div>
		</article>
	</section>
</body>
<script>
	document.querySelectorAll("div").forEach(div => {
		div.innerHTML += "<pre>" + div.getAttribute("style").replace(/transform: /, '') + "</pre>";
	});
</script>
</html>
