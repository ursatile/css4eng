<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Animatable Properties</title>
	<style>
		input[type=checkbox] {
			&::after {
				content: 'unchecked';
				padding-left: 1.2em;
			}
			&:checked::after {
				content: 'checked';
			}
		}
	</style>
</head>
<body>
	<input type="checkbox">


</body>
</html>
