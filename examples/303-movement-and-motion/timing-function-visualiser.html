<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Timing Function Visualiser</title>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			display: flex;
			flex-wrap: wrap;
			justify-content: space-around;
			padding: 10px;
			gap: 10px;
		}

		div {
			flex: 0 0 22vw;
			aspect-ratio: 1;
			border: 1px solid #000;
			font-family: Consolas, 'Courier New', Courier, monospace;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 0.6em;
			position: relative;
			span {
				display: block;
				position: absolute;
				left: 0px;
				bottom: 0px;
				width: 20px;
				height: 20px;
				background-color: red;
				border-radius: 100%;
				transition: left 1s, bottom 1s;
			}

			&:hover span {
				left: calc(100% - 20px);
				bottom: calc(100% - 20px);
			}
		}
	</style>
</head>
<body>
	<div><span style="transition-timing-function: linear, linear;"></span> linear</div>
	<div><span style="transition-timing-function: linear, ease;"></span> ease</div>
	<div><span style="transition-timing-function: linear, ease-in;"></span> ease-in</div>
	<div><span style="transition-timing-function: linear, ease-out;"></span> ease-out</div>
	<div><span style="transition-timing-function: linear, ease-in-out;"></span> ease-in-out</div>
	<div><span style="transition-timing-function: linear, cubic-bezier(0.2,-0.5,0.8,1.5);"></span> cubic-bezier(0.2,-1,0.8,2)</div>
	<div><span style="transition-timing-function: linear, steps(3);"></span> steps(3)</div>
	<div><span style="transition-timing-function: linear, steps(3, jump-start);"></span> steps(3, jump-start)</div>
</body>
</html>
