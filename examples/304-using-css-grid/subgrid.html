<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Subgrid</title>
	<style>
		section {
			width: 30vw;
			aspect-ratio: 1;
			display: grid;
			grid-template-columns: 1fr 2fr 3fr 4fr 5fr;
			grid-template-rows: repeat(5, 1fr);
			gap: 5px;

			span.subgrid {
				grid-column: span 3;
				grid-row: span 3;
				display: grid;
				grid-template-columns: subgrid;
				grid-template-rows: subgrid;
				gap: 5px;

				span {
					background-color: crimson;
					color: white;
				}
			}
		}
	</style>
	<style>
		body {
			display: flex;
			align-items: space-between;
			gap: 20px;
		}

		section {
			background-color: royalblue;

			div,
			span {
				background-color: gold;
				padding: 20px;
			}

			counter-reset: grid-item;

			>span {
				font-family: Consolas, 'Courier New', Courier, monospace;
				text-align: center;
				counter-increment: grid-item;
				display: flex;
				align-items: center;
				justify-content: center;

				&:not(.subgrid)::before { content: counter(grid-item); }
			}
		}
	</style>
</head>
<body>
	<section>
		<span></span><span></span><span></span><span></span><span></span>
		<span></span>
		<span class="subgrid">
			<span></span><span></span><span></span>
			<span></span><span></span><span></span>
			<span></span><span></span><span></span>
		</span>
		<span></span>
		<span></span><span></span>
		<span></span><span></span>
		<span></span><span></span><span></span><span></span><span></span>
	</section>

	<section>
		<span></span><span></span><span></span><span></span><span></span>
		<span></span>
		<span class="subgrid">
			<span></span><span></span><span></span>
			<span></span><span></span><span></span>
			<span></span><span></span><span></span>
		</span>
		<span></span>
		<span></span><span></span>
		<span></span><span></span>
		<span></span><span></span><span></span><span></span><span></span>
	</section>


</body>
</html>
