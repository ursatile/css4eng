<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CSS Grid Named Columns</title>
	<style>
		body {
			display: grid;
			padding: 10px;
			gap: 10px;
			grid-template-columns:
				[start-nav] 200px [end-nav] [start-content] 2fr 2fr 2fr [end-content] [start-ads] 200px [end-ads];

				nav, main, aside {
					background-color: silver;
				}

			nav {
				grid-column-start: start-nav;
				grid-column-end: end-nav;
			}
			main {
				grid-column-start: start-content;
				grid-column-end: end-content;
			}
			aside#adverts {
				grid-column-start: start-ads;
				grid-column-end: end-ads;
			}
	</style>
</head>
<body>
	<nav>
		nav
	</nav>
	<main>
		main
	</main>
	<aside id="adverts">
		adverts
	</aside>
</body>
</html>
