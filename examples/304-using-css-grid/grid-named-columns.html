<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Grid Named Columns</title>
	<style>
		section {
			display: grid;
			padding: 10px;
			gap: 10px;
			grid-template-columns:
				[alice] 1fr [betty] 1fr [carol] 1fr [diana] 1fr [eliza];
				div {
					background: crimson;
					padding: 20px;
		}
	</style>
		<link rel="stylesheet" href="grid-demo.css">

</head>
<body>
	<section>
		<div style="grid-column-start: betty; grid-column-end: eliza;"></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
	</section>

</body>
</html>
