<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CSS Grid Named Columns</title>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			height: 100vh;
			max-width: 960px;
			margin: 0px auto;
			padding: 20px;

			display: grid;
			gap: 10px;
			grid-template-columns:
				[start-nav] 180px [end-nav start-content] 2fr 2fr 2fr [end-content start-ads] 180px [end-ads];

			nav {
				grid-column-start: start-nav;
				grid-column-end: end-nav;
			}

			main {
				grid-column-start: start-content;
				grid-column-end: end-content;
			}

			aside#adverts {
				grid-column-start: start-ads;
				grid-column-end: end-ads;
			}

			>* {
				background-color: silver;
				display: flex;
				justify-content: center;
				align-items: center;
				font-family: Consolas, 'Courier New', Courier, monospace;
			}
	</style>
</head>
<body>
	<nav>
		nav
	</nav>
	<main>
		main
	</main>
	<aside id="adverts">
		adverts
	</aside>
</body>
</html>
