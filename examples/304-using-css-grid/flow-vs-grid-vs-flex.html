<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Flow Vs Grid Vs Flex</title>
	<style>
		div {
			background: gold;
			padding: 10px;
			margin: 10px;
			min-width: 80px;
		}

		section[style*="display: flex"] {
			div { flex: 1; }
		}
	</style>
	<style>
		article {
			display: flex;
			padding: 10px;
			gap: 10px;

			section {
				flex: 0 1 33%;
				background: royalblue;
			}
		}
	</style>
</head>
<body>
	<article>
		<section>
			<div>1</div>
			<div>2</div>
			<div>3</div>
			<div>4</div>
			<div>5</div>
		</section>
		<section style="display: flex; flex-wrap: wrap;">
			<div>1</div>
			<div>2</div>
			<div>3</div>
			<div>4</div>
			<div>5</div>
		</section>
		<section style="display: grid; grid: auto / 1fr 1fr;">
			<div>1</div>
			<div>2</div>
			<div>3</div>
			<div>4</div>
			<div>5</div>
		</section>
	</article>
</body>
</html>
