<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Default Grid</title>
	<link rel="stylesheet" href="grid-demo.css">
	<style>
		section {
			display: grid;
			grid-auto-flow: column;
			grid-template-rows: 80px 2fr 1fr;
			grid-auto-columns: 100px 50px;
			gap: 10px;
			padding: 10px;
		}
	</style>
</head>
<body>
	<section>

	</section>

</body>
</html>
