<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Space Between Inline Elements</title>
</head>
<body>
	<p><em>there</em><code>are</code><strong>NO</strong><kbd>spaces</kbd>here</p>
	<p><em>there</em> <strong>are</strong> <code>spaces</code> <kbd>here</kbd></p>
	<p>
		<em>there</em>    <!-- loads of whitespace here! -->    <strong>are</strong>


		<code>spaces</code>


		<kbd>here</kbd>
	</p>
</body>
</html>
