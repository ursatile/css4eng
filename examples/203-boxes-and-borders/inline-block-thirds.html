<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>inline-block</title>
	<style>
		div {
			font-family: Consolas, 'Courier New', Courier, monospace;
			box-sizing: border-box;
			display: inline-block;
			background-color: gold;
			padding: 10px 5px;
			width: 33%;
		}

</head>

	<div>width: 33%;</div>
	<div>width: 33%;</div>
</body>
</html>
