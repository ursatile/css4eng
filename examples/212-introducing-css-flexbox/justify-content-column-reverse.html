<!DOCTYPE html>
<html lang="en" dir="">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>justify-content with flex-direction: column</title>
	<style>
		html {
			font-family: Consolas, 'Courier New', Courier, monospace;
		}

		body {
			display: flex;
			justify-content: space-between;
			gap: 5px;

			section {
				width: 16.67vw;
				text-align: center;

				div {
					padding: 5px;
					gap: 5px;
					display: flex;
					flex-direction: column-reverse;
					background-color: royalblue;
					height: 21rem;

					span {
						background-color: gold;
						padding: 5px;
					}
				}
			}
		}
	</style>
</head>
<body>
	<section>
		<code>flex-start</code>
		<div style="justify-content: flex-start;">
			<span>A</span>
			<span>B</span>
			<span>C</span>
		</div>
	</section>
	<section>
		<code>flex-end</code>
		<div style="justify-content: flex-end;">
			<span>A</span>
			<span>B</span>
			<span>C</span>
		</div>
	</section>
	<section>
		<code>center</code>
		<div style="justify-content: center;">
			<span>A</span>
			<span>B</span>
			<span>C</span>
		</div>
	</section>
	<section>
		<code>space-between</code>
		<div style="justify-content: space-between;">
			<span>A</span>
			<span>B</span>
			<span>C</span>
		</div>
	</section>
	<section>
		<code>space-around</code>
		<div style="justify-content: space-around;">
			<span>A</span>
			<span>B</span>
			<span>C</span>
		</div>
	</section>
	<section>
		<code>space-evenly</code>
		<div style="justify-content: space-evenly;">
			<span>A</span>
			<span>B</span>
			<span>C</span>
		</div>
	</section>
</body>
</html>
