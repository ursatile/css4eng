<!DOCTYPE html>
<html lang="en">
<head>
  <title>display-flex</title>
	<style>
		section {
			border: 1px solid black;
			padding: 0.2rem;
			margin: 0.2rem;
			div {
				padding: 0.5rem;
				margin: 0.2rem;
			}
			div:nth-child(1) { background: red; }
			div:nth-child(2) { background: gold; }
			div:nth-child(3) { background: cyan; }
			div:nth-child(4) { background: magenta; }
		}
	</style>
</head>
<body>
	<section style="display: flex;">
		<div>A</div>
		<div>B</div>
		<div>C</div>
		<div>D</div>
	</section>
	<section style="display: flex; flex-direction: column;">
		<div>A</div>
		<div>B</div>
		<div>C</div>
		<div>D</div>
	</section>
	<section style="display: flex; flex-direction: row-reverse;">
		<div>A</div>
		<div>B</div>
		<div>C</div>
		<div>D</div>
	</section>
	<section style="display: flex; flex-direction: column-reverse;">
		<div>A</div>
		<div>B</div>
		<div>C</div>
		<div>D</div>
	</section>

</body>
</html>
