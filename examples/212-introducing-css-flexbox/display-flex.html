<!DOCTYPE html>
<html lang="en">
<head>
  <title>display-flex</title>
	<style>
		section {
			background-color: royalblue;
			border-radius: 4px;
			padding: 0.2rem;
			margin: 0.2rem;
			span {
				padding: 0.5rem;
				margin: 0.2rem;
			}
			span:nth-child(1) { background: red; }
			span:nth-child(2) { background: gold; }
			span:nth-child(3) { background: #00d9ff; }
		}
	</style>
</head>
<body>
	<section style="display: flex;">
		<span>A</span>
		<span>B</span>
		<span>C</span>
	</section>
	<section style="display: flex; flex-direction: column;">
		<span>A</span>
		<span>B</span>
		<span>C</span>
	</section>
	<section style="display: flex; flex-direction: row-reverse;">
		<span>A</span>
		<span>B</span>
		<span>C</span>
	</section>
	<section style="display: flex; flex-direction: column-reverse;">
		<span>A</span>
		<span>B</span>
		<span>C</span>
	</section>

</body>
</html>
