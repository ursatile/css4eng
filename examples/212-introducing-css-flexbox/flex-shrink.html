<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Flex shrink</title>
	<style>
		section {
			* {
				box-sizing: border-box;
			}

			width: 360px;
			background-color: royalblue;
			display: flex;
			gap: 5px;
			padding: 5px;
			margin: 5px;

			div {
				flex-basis: 100px;
				font-family: Consolas, 'Courier New', Courier, monospace;
				font-size: 0.8rem;
				background-color: gold;
				padding: 5px;
			}
		}
	</style>

</head>
<body>
	<section>
		<div style="flex-shrink: 0;">0</div>
		<div style="flex-shrink: 0;">0</div>
		<div style="flex-shrink: 0;">0</div>
		<div style="flex-shrink: 0;">0</div>
		<div style="flex-shrink: 0;">0</div>
	</section>
	<section>
		<div>1</div>
		<div>1</div>
		<div>1</div>
		<div>1</div>
		<div>1</div>
	</section>
	<section>
		<div>1</div>
		<div style="flex-shrink: 0;">0</div>
		<div style="flex-shrink: 0;">0</div>
		<div style="flex-shrink: 0;">0</div>
		<div style="flex-shrink: 0;">0</div>
	</section>
	<section>
		<div style="flex-shrink: 1;">1</div>
		<div style="flex-shrink: 2;">2</div>
		<div style="flex-shrink: 3;">3</div>
		<div style="flex-shrink: 4;">4</div>
		<div style="flex-shrink: 5;">5</div>
	</section>
	<section>
		<div style="flex-shrink: 1;">1</div>
		<div style="flex-shrink: 1;">1</div>
		<div style="flex-shrink: 1;">1</div>
		<div style="flex-shrink: 10;">10</div>
		<div style="flex-shrink: 100;">100</div>
	</section>
</body>
</html>
