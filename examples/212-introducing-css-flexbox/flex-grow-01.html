<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Flex Grow 01</title>
	<style>
		* {
			box-sizing: border-box;
		}

		section {
			width: 720px;
			font-family: Consolas, 'Courier New', Courier, monospace;
			background-color: royalblue;
			display: flex;
			padding: 5px;
			gap: 5px;
			position: relative;

			div {
				flex-basis: 50px;
				padding: 5px;
				background-color: gold;
			}
		}
	</style>
</head>
<body>
	<section>
		<div style="flex-grow: 1;">A</div>
		<div style="flex-grow: 2;">B</div>
		<div style="flex-grow: 3;">C</div>
		<div style="flex-grow: 4;">D</div>
		<div style="flex-grow: 5;">E</div>
	</section>
</body>
</html>
