<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Flex Wrap</title>
	<style>
		div {
			display: flex;
			margin: 10px;
			border-radius: 5px;
			background-color: royalblue;
		}

		span {
			width: 3rem;
			margin: 5px;
			padding: 5px;
			text-align: center;
			background-color: gold;
			border-radius: 2px;
			text-align: center;
		}
	</style>
</head>
<body>
	<p><code>flex-wrap: nowrap (default)</code>:
		Elements shrink to fit along one axis if possible. If they can't
		shrink any further, the content overflows the container.
	</p>
	<div style="display: flex; flex-wrap: nowrap">
		<span>A</span><span>B</span><span>C</span><span>D</span><span>E</span>
		<span>F</span><span>G</span><span>H</span><span>I</span><span>J</span>
		<span>K</span><span>L</span><span>M</span><span>N</span><span>O</span>
		<span>P</span><span>Q</span><span>R</span><span>S</span><span>T</span>
		<span>U</span><span>V</span><span>W</span><span>X</span><span>Y</span>
		<span>Z</span>
	</div>
	<div style="display: flex; flex-wrap: wrap">
		<span>A</span><span>B</span><span>C</span><span>D</span><span>E</span>
		<span>F</span><span>G</span><span>H</span><span>I</span><span>J</span>
		<span>K</span><span>L</span><span>M</span><span>N</span><span>O</span>
		<span>P</span><span>Q</span><span>R</span><span>S</span><span>T</span>
		<span>U</span><span>V</span><span>W</span><span>X</span><span>Y</span>
		<span>Z</span>
	</div>
	<div style="display: flex; flex-wrap: wrap-reverse">
		<span>A</span><span>B</span><span>C</span><span>D</span><span>E</span>
		<span>F</span><span>G</span><span>H</span><span>I</span><span>J</span>
		<span>K</span><span>L</span><span>M</span><span>N</span><span>O</span>
		<span>P</span><span>Q</span><span>R</span><span>S</span><span>T</span>
		<span>U</span><span>V</span><span>W</span><span>X</span><span>Y</span>
		<span>Z</span>
	</div>
</body>
</html>
