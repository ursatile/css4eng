<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>justify-content</title>
	<style>
		div {
			border-radius: 4px;
			display: flex;
			background-color: royalblue;
			margin: 5px;
			span {
				border-radius: 4px;
				width: 10vw;
				background-color: gold;
				margin: 5px;
				padding: 5px;
				text-align: center;
			}
		}
	</style>
</head>
<body>
	<p><code>justify-content: flex-start</code></p>
	<div style="justify-content: flex-start;">
		<span>A</span>
		<span>B</span>
		<span>C</span>
		<span>D</span>
		<span>E</span>
	</div>
	<p><code>justify-content: flex-end</code></p>
	<div style="justify-content: flex-end;">
		<span>A</span>
		<span>B</span>
		<span>C</span>
		<span>D</span>
		<span>E</span>
	</div>
	<p><code>justify-content: center</code></p>
	<div style="justify-content: center;">
		<span>A</span>
		<span>B</span>
		<span>C</span>
		<span>D</span>
		<span>E</span>
	</div>
	<p><code>justify-content: space-between</code></p>
	<div style="justify-content: space-between;">
		<span>A</span>
		<span>B</span>
		<span>C</span>
		<span>D</span>
		<span>E</span>
	</div>
	<p><code>justify-content: space-around</code></p>
	<div style="justify-content: space-around;">
		<span>A</span>
		<span>B</span>
		<span>C</span>
		<span>D</span>
		<span>E</span>
	</div>
	<p><code>justify-content: space-evenly</code></p>
	<div style="justify-content: space-evenly;">
		<span>A</span>
		<span>B</span>
		<span>C</span>
		<span>D</span>
		<span>E</span>
	</div>
</body>
</html>
