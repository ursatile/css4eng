<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>justify-content</title>
	<style>
		div {
			display: flex;
			background-color: royalblue;
			margin: 5px;
			span {
				width: 3rem;
				background-color: gold;
				margin: 5px;
			}
		}


	</style>
</head>
<body>
	<div style="justify-content: flex-start;">
		<span>A</span>
		<span>B</span>
		<span>C</span>
		<span>D</span>
		<span>E</span>
	</div>
	<div style="justify-content: flex-end;">
		<span>A</span>
		<span>B</span>
		<span>C</span>
		<span>D</span>
		<span>E</span>
	</div>
	<div style="justify-content: center;">
		<span>A</span>
		<span>B</span>
		<span>C</span>
		<span>D</span>
		<span>E</span>
	</div>
	<div style="justify-content: space-between;">
		<span>A</span>
		<span>B</span>
		<span>C</span>
		<span>D</span>
		<span>E</span>
	</div>
	<div style="justify-content: space-around;">
		<span>A</span>
		<span>B</span>
		<span>C</span>
		<span>D</span>
		<span>E</span>
	</div>
	<div style="justify-content: space-evenly;">
		<span>A</span>
		<span>B</span>
		<span>C</span>
		<span>D</span>
		<span>E</span>
	</div>
</body>
</html>
