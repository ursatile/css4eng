<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Flex Grow</title>
	<style>
		section {
			background-color: royalblue;
			display: flex;
			gap: 5px;
			padding: 5px;
			margin: 5px;

			div {
				font-family: Consolas, 'Courier New', Courier, monospace;
				background-color: gold;
				padding: 5px;
			}
		}
	</style>

</head>
<body>
	<section>
		<div style="flex-grow: 1">1</div>
		<div>0</div>
		<div>0</div>
		<div>0</div>
		<div>0</div>
	</section>
	<section>
		<div style="flex-grow: 1">1</div>
		<div>0</div>
		<div style="flex-grow: 1">1</div>
		<div>0</div>
		<div style="flex-grow: 1">1</div>
	</section>
	<section>
		<div style="flex-grow: 1">flex-grow: 1</div>
		<div style="flex-grow: 1">flex-grow: 1</div>
		<div style="flex-grow: 1">flex-grow: 1</div>
		<div style="flex-grow: 1">flex-grow: 1</div>
		<div style="flex-grow: 1">flex-grow: 1</div>
	</section>

	<section>
		<div style="flex-grow: 1;">1</div>
		<div style="flex-grow: 2;">2</div>
		<div style="flex-grow: 4;">4</div>
		<div style="flex-grow: 8;">8</div>
		<div style="flex-grow: 16;">16</div>
	</section>
	<section>
		<div style="flex-grow: 1;">flex-grow: 1</div>
		<div style="flex-grow: 2;">flex-grow: 2</div>
		<div style="flex-grow: 4;">flex-grow: 4</div>
		<div style="flex-grow: 8;">flex-grow: 8</div>
		<div style="flex-grow: 16;">flex-grow: 16</div>
	</section>
</body>
</html>
