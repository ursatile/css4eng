<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>css flex shorthand</title>
	<style>
		* { box-sizing: border-box; }
		section {
			display: flex;
			background-color: royalblue;
			gap: 5px;
			padding: 5px;
			margin: 5px;
			div {
				background-color: gold;
				padding: 5px;
			}
			&#b {
				div {
					flex: 1;
				}
			}
		}

	</style>
</head>
<body>
	<section id="a">
		<div>A</div>
		<div>A</div>
		<div>A</div>
		<div>A</div>
	</section>
	<section id="b">
		<div>B</div>
		<div>B</div>
		<div>B</div>
		<div>B</div>
	</section>
	<section>
		<div style="flex: 2;">C</div>
		<div style="flex: 3;">C</div>
		<div style="flex: 4;">C</div>
		<div style="flex: 5;">C</div>
	</section>
</body>
</html>
