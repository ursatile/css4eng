<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Select With Button Option</title>
	<style>
		select {
			 appearance: base-select;
			 border: none;
			 &::picker-icon { display: none; }
		}
		button {
			border: none;
			color: blue;
			text-decoration: underline;
		}
	</style>

</head>
<body>
	<select>
		<button>
			Choose a rock band
		</button>
		<option>AC/DC</option>
		<option>Bon Jovi</option>
		<option>Cinderella</option>
		<option>Def Leppard</option>
		<option>Europe</option>
		<option>Fleetwood Mac</option>

	</select>

</body>
</html>
