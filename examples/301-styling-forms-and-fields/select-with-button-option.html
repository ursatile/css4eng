<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Select With Button Option</title>
	<style>
		select {
			outline: 1px solid orange;
			appearance: base-select;
			border: none;

			&::picker-icon { display: none; }

			button {
				span { background-color: gold; }
				selectedcontent { background-color: turquoise; }
			}
		}
	</style>
	<style>
		body { padding: 10px; }
		* { box-sizing: border-box; }

	</style>
</head>
<body>
	<select>
		<button>
			<span>PICK A ROCK BAND</span>
			<selectedcontent></selectedcontent>
		</button>
		<option>AC/DC</option>
		<option>Bon Jovi</option>
		<option>Cinderella</option>
		<option>Def Leppard</option>
		<option>Europe</option>
		<option>Fleetwood Mac</option>

	</select>

</body>
</html>
