<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Html5 Form Elements</title>
	<style>
		p {
			padding: 10px 0;
			border-top: 1px solid #000;
			margin: 0;
		}
		label {
			font-family: Consolas, 'Courier New', Courier, monospace;
			width: 22em;
		}
	</style>

</head>
<body>
	<h1>HTML5 Input Types</h1>
	<p><label for="color">color:</label> <input type="color"
			id="color"></p>
	<p><label for="date">date:</label> <input type="date"
			id="date"></p>
	<p><label for="datetime-local">datetime-local:</label>
		<input type="datetime-local" id="datetime-local">
	</p>
	<p><label for="email">email:</label> <input type="email"
			id="email"></p>
	<p><label for="month">month:</label> <input type="month"
			id="month"></p>
	<p><label for="number">number:</label> <input
			type="number" id="number"></p>
	<p><label for="range">range:</label> <input type="range"
			id="range"></p>
	<p><label for="search">search:</label> <input
			type="search" id="search"></p>
	<p><label for="tel">tel:</label> <input type="tel"
			id="tel"></p>
	<p><label for="time">time:</label> <input type="time"
			id="time"></p>
	<p><label for="url">url:</label> <input type="url"
			id="url"></p>
	<p><label for="week">week:</label> <input type="week"
			id="week"></p>

</body>
</html>
