<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Html5 Form Elements</title>
	<style>
		p {
			border-bottom: 1px solid #000;
			display: flex;
			align-items: center;
			height: 4em;
		}
		label {
			font-family: Consolas, 'Courier New', Courier, monospace;
			width: 22em;
		}
	</style>

</head>
<body>
	<p><label for="color">&lt;input type="color"&gt;</label> <input type="color"
			id="color"></p>
	<p><label for="date">&lt;input type="date"&gt;</label> <input type="date"
			id="date"></p>
	<p><label for="datetime-local">&lt;input type="datetime-local"&gt;</label>
		<input type="datetime-local" id="datetime-local">
	</p>
	<p><label for="email">&lt;input type="email"&gt;</label> <input type="email"
			id="email"></p>
	<p><label for="month">&lt;input type="month"&gt;</label> <input type="month"
			id="month"></p>
	<p><label for="number">&lt;input type="number"&gt;</label> <input
			type="number" id="number"></p>
	<p><label for="range">&lt;input type="range"&gt;</label> <input type="range"
			id="range"></p>
	<p><label for="search">&lt;input type="search"&gt;</label> <input
			type="search" id="search"></p>
	<p><label for="tel">&lt;input type="tel"&gt;</label> <input type="tel"
			id="tel"></p>
	<p><label for="time">&lt;input type="time"&gt;</label> <input type="time"
			id="time"></p>
	<p><label for="url">&lt;input type="url"&gt;</label> <input type="url"
			id="url"></p>
	<p><label for="week">&lt;input type="week"&gt;</label> <input type="week"
			id="week"></p>

</body>
</html>
