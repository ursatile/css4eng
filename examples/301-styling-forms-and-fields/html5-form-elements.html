<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Html5 Form Elements</title>
	<style>
		p {
			padding: 10px 0;
			border-top: 1px solid #000;
			margin: 0;
		}

		label {
			font-family: Consolas, 'Courier New', Courier, monospace;
			width: 12em;
			display: inline-block;
		}

		span {
			font-family: Consolas, 'Courier New', Courier, monospace;
			float: right;
			display: block;
		}
	</style>
</head>
<body>
	<h1>HTML5 Input Types</h1>
	<p><label for="color">color:</label>
		<input type="color" id="color" value="#336699">
		<span></span>
	</p>
	<p><label for="date">date:</label>
		<input type="date" id="date" value="1955-11-05">
		<span></span>
	</p>
	<p><label for="datetime-local">datetime-local:</label>
		<input type="datetime-local" id="datetime-local"
			value="1955-11-05T12:34:56">
		<span></span>
	</p>
	<p><label for="email">email:</label>
		<input type="email" id="email" value="dylan@dylanbeattie.net">
		<span></span>
	</p>
	<p><label for="month">month:</label>
		<input type="month" id="month" value="1955-11">
		<span></span>
	</p>
	<p><label for="number">number:</label>
		<input type="number" id="number" value="55">
		<span></span>
	</p>
	<p><label for="range">range:</label>
		<input type="range" id="range" value="55">
		<span></span>
	</p>
	<p><label for="search">search:</label>
		<input type="search" id="search" value="how to generate 1.21Gw">
		<span></span>
	</p>
	<p><label for="tel">tel:</label>
		<input type="tel" id="tel">
		<span></span>
	</p>
	<p><label for="time">time:</label>
		<input type="time" id="time">
		<span></span>
	</p>
	<p><label for="url">url:</label>
		<input type="url" id="url">
		<span></span>
	</p>
	<p><label for="week">week:</label>
		<input type="week" id="week">
		<span></span>
	</p>
</body>
<script>
	function updateSpanWithInputValue() {
		const span = this.parentElement.querySelector('span');
		console.log(span);
		if (span) span.innerHTML = this.value;
		console.log(this);
	};

	document.addEventListener('DOMContentLoaded', function () {
		document.querySelectorAll('input').forEach(input => {
			let update = updateSpanWithInputValue.bind(input);
			input.addEventListener('change', update);
			update();
		});
	});
</script>
</html>
