<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Radio Buttons Inside Labels</title>
</head>
<body>
	<h4>Input Inside Label</h4>
	<fieldset>
		<legend>Favourite Member of Destiny's Child</legend>
		<label>
			<input type="radio" name="destinys-child" value="beyonce"> Beyoncé
		</label>
		<label>
			<input type="radio" name="destinys-child" value="kelly"> Kelly
			Rowland </label>
		<label>
			<input type="radio" name="destinys-child" value="michelle"> Michelle
			Williams </label>
	</fieldset>
</body>
</html>
