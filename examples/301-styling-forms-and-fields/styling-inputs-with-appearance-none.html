<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Styling Inputs With Appearance None</title>
	<style>
		fieldset {
			border: 2px solid navy;
			border-radius: 5px;
			margin-bottom: 20px;
		}

		input[type="radio"],
		input[type="checkbox"] {
			appearance: none;
			width: 20px;
			height: 20px;
			border: 3px solid silver;
			display: inline-grid;
			place-content: center;
			translate: 0 -1px;

			&:focus { outline: 1px solid navy; }
			&::before { transition: scale 0.2s; }

			&:checked {
				border-color: navy;

				&::before { scale: 1; }
			}
		}

		input[type="checkbox"] {
			border-radius: 2px;

			&::before {
				content: "✔";
				font-weight: 900;
				color: navy;
				font-size: 1.2em;
				scale: 0;
				position: relative;
				top: -1px;
			}
		}

		input[type="radio"] {
			border-radius: 12px;

			&::before {
				content: "";
				width: 10px;
				height: 10px;
				box-shadow: inset 1rem 1rem navy;
				border-radius: 1rem;
				scale: 0;
			}
		}
	</style>
</head>
<body>
	<fieldset>
		<legend>Favourite Queen Member</legend>
		<label>
			<input type="radio" name="queen" value="fm"> Freddie Mercury
		</label>
		<label>
			<input type="radio" name="queen" value="bm" checked> Brian May
		</label>
		<label>
			<input type="radio" name="queen" value="jd"> John Deacon
		</label>
		<label>
			<input type="radio" name="queen" value="rt"> Roger Taylor
		</label>
	</fieldset>
	<fieldset>
		<legend>Which Queen Albums Do You Own?</legend>
		<label>
			<input type="checkbox" name="albums" value="queen"> Queen
		</label>
		<label>
			<input type="checkbox" name="albums" value="queen-ii"> Queen II
		</label>
		<label>
			<input type="checkbox" name="albums" value="sheer-heart-attack">
			Sheer Heart Attack
		</label>
		<label>
			<input type="checkbox" name="albums" value="a-night-at-the-opera" checked>
			A Night At The Opera
		</label>
	</fieldset>
</body>
</html>
