<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Styling Inputs With Appearance None</title>
	<style>
		input[type="radio"],
		input[type="checkbox"] {
			appearance: none;
			width: 1.4em;
			height: 1.4em;
			border: 3px solid silver;
			display: inline-grid;
			place-content: center;

			&:focus { outline: 1px solid silver; }

			&:checked {
				border-color: navy;

				&::before { scale: 1; }
			}
		}

		input[type="radio"] {
			border-radius: 1rem;

			&::before {
				left: 2px;
				top: 2px;
				content: "";
				width: 0.6em;
				height: 0.6em;
				box-shadow: inset 1rem 1rem navy;
				border-radius: 1rem;
				scale: 0;
			}
		}
	</style>
</head>
<body>
	<fieldset>
		<legend>Favourite Queen Member</legend>
		<label>
			<input type="radio" name="queen" value="fm"> Freddie Mercury
		</label>
		<label>
			<input type="radio" name="queen" value="bm" checked> Brian May
		</label>
		<label>
			<input type="radio" name="queen" value="jd"> John Deacon
		</label>
		<label>
			<input type="radio" name="queen" value="rt"> Roger Taylor
		</label>
	</fieldset>
	<fieldset>
		<legend>Which Queen Albums Do You Own?</legend>
		<label>
			<input type="checkbox" name="albums" value="queen"> Queen
		</label>
		<label>
			<input type="checkbox" name="albums" value="queen-ii"> Queen II
		</label>
		<label>
			<input type="checkbox" name="albums" value="sheer-heart-attack">
			Sheer Heart Attack
		</label>
		<label>
			<input type="checkbox" name="albums" value="a-night-at-the-opera" checked>
			A Night At The Opera
		</label>
	</fieldset>
</body>
</html>
