<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Basic Select</title>
	<style>
		select,
		::picker(select) { appearance: base-select; }

		select {
			background: url('angles-down.svg') right center / 1rem 1rem no-repeat;

			border-radius: 5px;
			border: 2px solid blue;
			padding: 5px;
			&::picker-icon {
				display: none;
				color: magenta;
			}
		}

		select:open {
			background-image: url('angles-up.svg');
			border-radius: 5px 5px 0 0;
			border-width: 1px 1px 0px 1px;
		}

		::picker(select) { background-color: magenta; }

	</style>
</head>
<body>
	<select>
		<option>select...</option>
		<option>AC/DC</option>
		<option>Bon Jovi</option>
		<option>Cinderella</option>
		<option>Def Leppard</option>
		<option>Europe</option>
		<option>Fleetwood Mac</option>
	</select>
</body>
</html>
