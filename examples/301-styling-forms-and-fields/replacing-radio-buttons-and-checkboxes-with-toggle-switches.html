<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Styling Inputs With Appearance None</title>
	<style>
		* { box-sizing: border-box; }

		fieldset {
			border: 2px solid silver;
			border-radius: 5px;
			margin-bottom: 20px;
		}

		input[type="radio"],
		input[type="checkbox"] {
			appearance: none;
			width: 36px;
			height: 20px;
			background-color: silver;
			border-radius: 10px;
			translate: 0 2px;

			display: inline-grid;
			place-content: center;

			&:focus { outline: 1px solid silver; }
			&:disabled::before { translate: 0 0;
				box-shadow: inset 1rem 1rem #ddd;
			 }

			&:checked {
				background-color: #369;

				&::before { translate: 8px 0; }
			}

			&::before {
				transition: translate 0.2s ease-in-out;
				content: "";
				width: 18px;
				height: 18px;
				box-shadow: inset 1rem 1rem white;
				border-radius: 1rem;
				translate: -8px 0;
			}
		}
	</style>
</head>
<body>
	<fieldset>
		<legend>Favourite Queen Member</legend>
		<label>
			<input type="radio" name="queen" value="fm"> Freddie Mercury
		</label>
		<label>
			<input type="radio" name="queen" value="bm" checked> Brian May
		</label>
		<label>
			<input type="radio" name="queen" value="jd"> John Deacon
		</label>
		<label>
			<input type="radio" name="queen" value="rt"> Roger Taylor
		</label>
		<label>
			<input type="radio" name="queen" value="se" disabled> Spike Edney
		</label>
	</fieldset>
	<fieldset>
		<legend>Which Queen Albums Do You Own?</legend>
		<label>
			<input type="checkbox" name="albums" value="queen"> Queen
		</label>
		<label>
			<input type="checkbox" name="albums" value="queen-ii"> Queen II
		</label>
		<label>
			<input type="checkbox" name="albums" value="Jazz">
			Jazz
		</label>
		<label>
			<input type="checkbox" name="albums" value="Hot Space" checked>
			Hot Space
		</label>
		<label>
			<input type="checkbox" name="albums" value="mr-bad-guy" disabled>
			Mr. Bad Guy
		</label>
	</fieldset>
</body>
</html>
