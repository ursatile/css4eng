<!DOCTYPE html>
<html lang="en">
<head>
	<title>Layout Grids with Breakpoints</title>
	<link rel="stylesheet" href="fluid-grid-breakpoints.css">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>

		img {
			width: 100%;
			height: 250px;
			object-fit: cover;
		}

		div[class*="col-"] {
			margin-top: 1vw;
			margin-bottom: 1vw;
			background-color: #000;
			padding: 10px;

			a {
				display: block;

</head>
