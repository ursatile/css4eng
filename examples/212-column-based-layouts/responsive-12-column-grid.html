<!DOCTYPE html>
<html lang="en">
<head>
	<title>Responsive 12-Column Grid Using Floats</title>
</head>
<body>
	<style>
		.container {
			width: 100%;
			max-width: 960px;
			margin: 0 auto;
			overflow: hidden;
			padding: 0 20px;
			box-sizing: border-box;
		}

		.row {
			width: 100%;
			overflow: hidden;
			margin-bottom: 10px;
		}

		.col-1 {
			width: calc((100% / 12) - 20px);
		}

		.col-2 {
			width: calc((100% / 6) - 20px);
		}

		.col-3 {
			width: calc((100% / 4) - 20px);
		}

		.col-4 {
				width: calc((100% / 3) - 20px);

		}

		.col-5 {
			width: calc((100% / (5/12)) - 20px);
		}

		.col-6 {
			width: calc((100% / (5/12)) - 20px);
		}

		.col-7 {
			width: 58.333%;
		}

		.col-8 {
			width: 66.666%;
		}

		.col-9 {
			width: 75%;
		}

		.col-10 {
			width: 83.333%;
		}

		.col-11 {
			width: 91.666%;
		}

		.col-12 {
			width: 100%;
		}

		[class*="col-"] {
			padding: 2px;
			font-family: Consolas;
			box-sizing: border-box;
			float: left;
			text-align: center;
			margin: 0 1%;
			background-color: #9999;
			min-height: 40px;
		}
	</style>

	<div class="container">
		<div class="row">
			<div class="col-1">col-1</div><div class="col-1">col-1</div><div class="col-1">col-1</div>
			<div class="col-1">col-1</div><div class="col-1">col-1</div><div class="col-1">col-1</div>
			<div class="col-1">col-1</div><div class="col-1">col-1</div><div class="col-1">col-1</div>
			<div class="col-1">col-1</div><div class="col-1">col-1</div><div class="col-1">col-1</div>
		</div>
		<div class="row">
			<div class="col-2">col-2</div>
			<div class="col-10">col-10</div>
		</div>
		<div class="row">
			<div class="col-4">col-4</div>
			<div class="col-4">col-4</div>
			<div class="col-4">col-4</div>
		</div>
		<div class="row">
			<div class="col-6">col-6</div>
			<div class="col-6">col-6</div>
		</div>
		<div class="row">
			<div class="col-12">col-12</div>
		</div>
	</div>
</body>
</html>
