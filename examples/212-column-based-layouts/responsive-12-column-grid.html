<!DOCTYPE html>
<html lang="en">
<head>
	<title>Responsive 12-Column Grid Using Floats</title>
	<link rel="stylesheet" href="12col-responsive.css">
</head>
<body>
	<style>

		[class*="col-"] {
			padding: 2px;
			font-family: Consolas;
			box-sizing: border-box;
			float: left;
			text-align: center;
			background-color: #9999;
		}
		.container {
			background-color: #939f;
		}
	</style>

	<div class="container">
		<div class="row">
			<div class="col-1">col-1</div><div class="col-1">col-1</div><div class="col-1">col-1</div>
			<div class="col-1">col-1</div><div class="col-1">col-1</div><div class="col-1">col-1</div>
			<div class="col-1">col-1</div><div class="col-1">col-1</div><div class="col-1">col-1</div>
			<div class="col-1">col-1</div><div class="col-1">col-1</div><div class="col-1">col-1</div>
		</div>
		<div class="row">
			<div class="col-2">col-2</div>
			<div class="col-10">col-10</div>
		</div>
		<div class="row">
			<div class="col-4">col-4</div>
			<div class="col-4">col-4</div>
			<div class="col-4">col-4</div>
		</div>
		<div class="row">
			<div class="col-6">col-6</div>
			<div class="col-6">col-6</div>
		</div>
		<div class="row">
			<div class="col-12">col-12</div>
		</div>
	</div>
</body>
</html>
