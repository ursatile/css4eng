<!DOCTYPE html>
<html lang="en">
<head>
	<title>Media Query Width Color</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
		body {
			@media (width < 400px) {
				background-color: red;
			}

			@media (400px <=width <= 600px) {
				background-color: yellow;
			}

			@media (width > 600px) {
				background-color: blue;
			}
		}
	</style>
</head>
<body>
	I'm responsive! Try resizing me.
</body>
</html>
