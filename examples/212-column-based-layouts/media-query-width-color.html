<!DOCTYPE html>
<html lang="en">
<head>
  <title>Media Query Width Color</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
		/* @media (width < 400px) { body { background-color: red; } }
		@media (400px <= width < 500px) { body { background-color: orange; } }
		@media (500px <= width < 600px) { body { background-color: yellow; } }
		@media (600px <= width < 700px) { body { background-color: green; } }
		@media (700px <= width < 800px) { body { background-color: blue; } }
		@media (width >= 800px) { body { background-color: purple; } } */
		body {
			background-color: blue;
			@media (width > 600px) {
				background-color: green;
			}
		}
	</style>
</head>
<body>
	I'm responsive! Try resizing me.
</body>
</html>
