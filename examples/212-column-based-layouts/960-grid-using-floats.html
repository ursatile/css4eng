<!DOCTYPE html>
<html lang="en">
<head>
	<title>960 Grid Using Floats</title>
	<link rel="stylesheet" href="960grid.css">
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap');

		html {
			font-family: Raleway, sans-serif;
			background-color: #000;
			color: #fff;
		}

		header {
			background: linear-gradient(to right, #036, black);

			h1 {
				font-weight: 100;
				padding: 5px;

				span {
					font-weight: 900;
				}
			}

			p {
				text-align: right;
				padding: 5px;
			}

		}

		nav {
			ul {
				margin: 0;
				padding: 0;
				li {
					a {
						background-color: #036;
						font-weight: bold;
						padding: 1em;
						margin: 1em;
						text-decoration: none;
						display: block;
						color: #fff;

						&:hover {
							background-color: #9cf;
							color: #000;
						}
					}
				}
			}
		}
	</style>
</head>
<body>
	<div class="container">
		<header class="row">
			<h1 class="col-4">
				<span>960</span>grid
			</h1>
			<p class="col-8">
				the world's<br>
				least responsive<br>
				grid system<br>
			</p>
		</header>
		<main class="row">
			<nav class="col-3">
				<ul>
					<li><a href="#">home</a></li>
					<li><a href="#">about</a></li>
					<li><a href="#">projects</a></li>
					<li><a href="#">events</a></li>
					<li><a href="#">contact</a></li>
				</ul>
			</nav>
		</main>
	</div>
</body>
</html>
