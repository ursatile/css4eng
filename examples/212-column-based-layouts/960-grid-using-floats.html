<!DOCTYPE html>
<html lang="en">
<head>
	<title>960 Grid Using Floats</title>
	<link rel="stylesheet" href="960grid.css">
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap');

		html {
			font-family: Raleway, sans-serif;
			background-color: #000;
			color: #fff;
		}

		header {
			background: linear-gradient(to right, #036, black);

			h1 {
				font-weight: 100;
				padding: 5px;

				span {
					font-weight: 900;
				}
			}
			p {
				text-align: right; padding: 5px;
			}
		}

		nav {
			background-color: #036;
			border-width: 1px 0;
			border-style: solid;
			border-color: #9cf;

			ul {
				margin: 0;
				padding: 0;

				li {
					display: inline-block;

					a {
						text-decoration: none;
						display: inline-block;
						padding: 5px;
						margin: 0 2px;
						color: #fff;

						&:hover {
							background-color: #9cf;
							color: #000;
						}
					}
				}
			}
	</style>
</head>
<body>
	<div class="container">
		<header class="row">
			<h1 class="col-4">
				<span>960</span>grid
			</h1>
			<p class="col-8">
				the world's<br>
				least responsive<br>
				grid system<br>
			</p>
		</header>
		<nav>
			<ul>
				<li><a href="#">home</a></li>
				<li><a href="#">about</a></li>
				<li><a href="#">projects</a></li>
				<li><a href="#">events</a></li>
				<li><a href="#">contact</a></li>
			</ul>
		</nav>
		<div class="row">
			<div class="col-1">col-1</div>
			<div class="col-1">col-1</div>
			<div class="col-1">col-1</div>
			<div class="col-1">col-1</div>
			<div class="col-1">col-1</div>
			<div class="col-1">col-1</div>
			<div class="col-1">col-1</div>
			<div class="col-1">col-1</div>
			<div class="col-1">col-1</div>
			<div class="col-1">col-1</div>
			<div class="col-1">col-1</div>
			<div class="col-1">col-1</div>
		</div>
		<div class="row">
			<div class="col-4">col-4</div>
			<div class="col-4">col-4</div>
			<div class="col-4">col-4</div>
		</div>
		<div class="row">
			<div class="col-6">col-6</div>
			<div class="col-6">col-6</div>
		</div>
		<div class="row">
			<div class="col-12">col-12</div>
		</div>
		<div class="row">
			<div class="col-1">col-1</div>
			<div class="col-11">col-11</div>
		</div>
		<div class="row">
			<div class="col-2">col-2</div>
			<div class="col-10">col-10</div>
		</div>
		<div class="row">
			<div class="col-3">col-3</div>
			<div class="col-9">col-9</div>
		</div>
		<div class="row">
			<div class="col-4">col-4</div>
			<div class="col-8">col-8</div>
		</div>
		<div class="row">
			<div class="col-5">col-5</div>
			<div class="col-7">col-7</div>
		</div>
	</div>
</body>
</html>
