<!DOCTYPE html>
<html lang="en">
<head>
	<title>960 Grid Using Floats</title>
	<link rel="stylesheet" href="960grid.css">
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap');

		html {
			font-family: Raleway, sans-serif;
			background-color: #000;
			color: #fff;
		}

		* {
			outline: 1px solid #f0f9;

			.container {
				outline: 1px solid #fc0c;
			}


			header {
				height: 5rem;

				h1 {
					font-weight: 100;
					padding: 5px;
					position: relative;
					top: 0.5em;

					span {
						font-weight: 900;
						position: relative;
						top: -0.5em;
					}
				}

				nav {
					text-align: right;
					padding: 5px;
					display: flex;
					height: 5rem;
					align-items: flex-end;
					justify-content: flex-end;

					a {
						display: inline-block;
						padding: 0.5em;
						color: #fff;
						font-weight: bold;
						text-decoration: none;

						&:hover {
							text-decoration: 4px underline;
						}
					}
				}
			}

			div#showcase {
				background-image: url(xie-lipton-SjrgIBKSLW0-unsplash.jpg);
				background-position: center;
				background-size: cover;
				height: 25em;
			}

			div#call-to-action {
				padding: 1em;

				h2 {
					text-transform: uppercase;
					font-size: 3em;
					letter-spacing: -0.05em;
				}

				a {
					background-color: indigo;
					color: #fff;
					text-decoration: none;
					padding: 5px;
					font-weight: 600;
					float: right;
					border-radius: 5px;

					&::after {
						content: ' ⮞';
					}
				}
			}
			div#categories {
				div {
					display: flex;
					height: 20em;
					align-items: flex-end;
					justify-content: center;
					a {

						padding: 0.5em;
						color: #fff;
						font-weight: bold;
						text-decoration: none;
						text-transform: uppercase;
						letter-spacing: 0.5em;

						&:hover {
							text-decoration: 4px underline;
						}

				}
			}
	</style>
</head>
<body>
	<div class="container">
		<header class="row">
			<h1 class="col-4">
				<span>guitar</span>garage
			</h1>
			<nav class="col-8">
				<a href="#">home</a>
				<a href="#">guitars</a>
				<a href="#">basses</a>
				<a href="#">pedals</a>
				<a href="#">amps</a>
			</nav>
		</header>
		<main>
			<div class="row">
				<div class="col-6" id="showcase">
				</div>
				<div class="col-6" id="call-to-action">
					<h2>Find Your<br>
						Next<br>
						Guitar<br>
						Today</h2>
					<p>Explore our guitars, basses, and effects, with instruments
						for every skill level and budget, and free shipping until
						Friday.</p>
					<a href="#">Browse Guitars</a>
				</div>
			</div>
			<div class="row" id="categories">
				<div class="col-4">
					<a href="#guitars">
						guitars
					</a>
				</div>
				<div class="col-4">
					<a href="#basses">
						basses
					</a>
				</div>
				<div class="col-4">
					<a href="#amps">
						amps
					</a>
				</div>
			</div>
		</main>
	</div>
</body>
</html>
