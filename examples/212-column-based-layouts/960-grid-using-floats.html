<!DOCTYPE html>
<html lang="en">
<head>
	<title>960 Grid Using Floats</title>
</head>
<body>
	<style>
		.container {
			width: 960px;
			margin: 0 auto;
			overflow: hidden;
		}

		.row {
			width: 100%;
			overflow: hidden;
			margin-bottom: 10px;
		}

		.col-1 {
			width: 60px;
		}

		.col-2 {
			width: 140px;
		}

		.col-3 {
			width: 220px;
		}

		.col-4 {
			width: 300px;
		}

		.col-5 {
			width: 380px;
		}

		.col-6 {
			width: 460px;
		}

		.col-7 {
			width: 540px;
		}

		.col-8 {
			width: 620px;
		}

		.col-9 {
			width: 700px;
		}

		.col-10 {
			width: 780px;
		}

		.col-11 {
			width: 860px;
		}

		.col-12 {
			width: 940px;
		}

		[class*="col-"] {
			padding: 2px;
			font-family: Consolas;
			box-sizing: border-box;
			float: left;
			text-align: center;
			margin: 0px 10px;
			background-color: #9999;
		}
	</style>

	<div class="container">
		<div class="row">
			<div class="col-1">col-1</div><div class="col-1">col-1</div><div class="col-1">col-1</div>
			<div class="col-1">col-1</div><div class="col-1">col-1</div><div class="col-1">col-1</div>
			<div class="col-1">col-1</div><div class="col-1">col-1</div><div class="col-1">col-1</div>
			<div class="col-1">col-1</div><div class="col-1">col-1</div><div class="col-1">col-1</div>
		</div>
		<div class="row">
			<div class="col-4">col-4</div>
			<div class="col-4">col-4</div>
			<div class="col-4">col-4</div>
		</div>
		<div class="row">
			<div class="col-6">col-6</div>
			<div class="col-6">col-6</div>
		</div>
		<div class="row">
			<div class="col-12">col-12</div>
		</div>
	</div>
	<div class="container">
		<div class="row">
			<header class="col-12">SITE HEADER</header>
		</div>
	</div>
</body>
</html>
