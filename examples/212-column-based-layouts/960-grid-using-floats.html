<!DOCTYPE html>
<html lang="en">
<head>
	<title>960 Grid Using Floats</title>
	<link rel="stylesheet" href="960grid.css">
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap');

		html {
			font-family: Raleway, sans-serif;
			background-color: #000;
			color: #fff;
		}
		* { outline: 1px solid #f0f9;
			.container { outline: 1px solid #fc0c; }


		header {
			height: 5rem;
			h1 {
				font-weight: 100;
				padding: 5px;
				position: relative;
				top: 0.5em;

				span {
					font-weight: 900;
					position: relative;
					top: -0.5em;
				}
			}

			nav {
				text-align: right;
				padding: 5px;
				display: flex;
				height: 5rem;
				align-items: flex-end;
				justify-content: flex-end;
				a {
					display: inline-block;
					padding: 0.5em;
					color: #fff;
					font-weight: bold;
					text-decoration: none;
					&:hover { text-decoration: 4px underline; }
				}
			}
		}

	</style>
</head>
<body>
	<div class="container">
		<header class="row">
			<h1 class="col-4">
				<span>guitar</span>garage
			</h1>
			<nav class="col-8">
				<a href="#">home</a>
				<a href="#">guitars</a>
				<a href="#">basses</a>
				<a href="#">pedals</a>
				<a href="#">amps</a>
			</nav>
		</header>
		<main class="row">
		</main>
	</div>
</body>
</html>
