<!DOCTYPE html>
<html lang="en">
<head>
	<title>Combined Filters</title>
	<style>
		p {
			margin: 2vw;
		}
		div {
			display: inline-block;
			width: 20vw;
			height: 20vw;
			margin: 2vw;
			outline: 2px solid #000;
			background: url(david-clode-ol4brlodnvY-unsplash.jpg) 100% 100% / cover;

			&:nth-child(2) {
				filter: brightness(1.2) saturate(0.3) contrast(10) blur(3px);
			}

			&:nth-child(3) {
				filter: brightness(1.2) blur(3px) contrast(10) saturate(0.3);
			}

			&:nth-child(4) {
				filter: brightness(1.2) blur(3px) saturate(0.3) contrast(10);
			}
		}
	</style>
</head>
<body>
	<div></div>
	<div></div>
	<div></div>
	<div></div>
	<p>

		Photo by <a
			href="https://unsplash.com/@davidclode?utm_content=creditCopyText&utm_medium=referral&utm_source=unsplash">David
			Clode</a> on <a
			href="https://unsplash.com/photos/a-colorful-bird-with-a-black-background-ol4brlodnvY?utm_content=creditCopyText&utm_medium=referral&utm_source=unsplash">Unsplash</a>
	</p>

</body>
</html>
