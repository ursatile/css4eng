<head>
	<title>Duotone Background</title>

		main {

		}

		section {
			display: flex;
			width: 30vw;
			height: 30vw;
			background-blend-mode: color, saturation;
			background-position: center;
			background-size: cover;
		}

		section.blues {
			background-image:
				linear-gradient(royalblue),
				linear-gradient(black),
				url(dominik-scythe-XV9F-gfmThs-unsplash.jpg);
		}

		section.jazz {
			background-image:
				linear-gradient(crimson),
				linear-gradient(black),
				url(jonny-gios-ypOlXA2eSew-unsplash.jpg);
			background-blend-mode: color-burn, saturation;
			background-size: cover;
		}
	</style>
</head>
