<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Radial Gradient Origin</title>
	<style>
		* {
			box-sizing: border-box;
		}

		div {
			float: left;
			margin: 1vw;
			width: 20vw;
			height: 20vw;
			border: 1px solid #000;

			&#a {
				background-image: radial-gradient(at 0 , yellow, red, blue, purple);
			}

			&#b {
				background-image: radial-gradient(at 0 100%, yellow, red, blue, purple);
			}

			&#c {
				background-image: radial-gradient(at 150% 150%,
				white 0 40%,
				skyblue 40%,
				white 45% 70%,
				skyblue 70%,
				white 75%);
			}

			&#d {
				border-radius: 100%;
				background-image: radial-gradient(at 25% 25%, pink 2%, red 25%, darkred 70%);
			}
		}
	</style>
</head>
<body>
	<div id="a"></div>
	<div id="b"></div>
	<div id="c"></div>
	<div id="d"></div>
</body>
</html>
