<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Radial Gradient Origin</title>
	<style>
		* {
			box-sizing: border-box;
		}

		div {
			float: left;
			margin: 1vw;
			width: 20vw;
			height: 20vw;
			border: 1px solid #000;

			&#a {
				background-image: conic-gradient(yellow, red, blue, purple);
			}

			&#b {
				background-image: conic-gradient(from 45deg, yellow, red, blue, purple);
			}

			&#c {
				background-image: conic-gradient(at 0 100%, yellow, red, blue, purple);
			}

			&#d {
				background-image: conic-gradient(from 45deg at 0 100%, yellow, red, blue, purple);
			}

			&#e {
				background-image: conic-gradient(from 60deg at 0 50%, yellow, red, blue, purple);
			}
			&#f {
				background-image: conic-gradient(from 45deg at -80% 110%,
				black 0 5deg,
				red 5deg 10deg,
				orange 10deg 15deg,
				gold 15deg 20deg,
				green 20deg 25deg,
				skyblue 25deg 30deg,
				purple 30deg 35deg,
				black 35deg);
			}
			&#g {
				background-image: conic-gradient(from 45deg at -80% 110%,
				black 0 5deg,
				red,
				orange,
				gold ,
				rgb(0, 202, 0),
				skyblue,
				purple,
				black 35deg);
			}
			&#h {
				background-image: conic-gradient(from 0 at 50% 25%,
					skyblue 90deg,
					green 90deg 130deg,
					grey 130deg 135deg,
					black 135deg 179deg,
					#fff 179deg 181deg,
					black 181deg 225deg,
					grey 225deg 230deg,
					green 230deg 270deg,
					skyblue 270deg

				);
		}
	</style>
</head>
<body>
	<div id="a"></div>
	<div id="b"></div>
	<div id="c"></div>
	<div id="d"></div>
	<div id="e"></div>
	<div id="f"></div>
	<div id="g"></div>
	<div id="h"></div>
</body>
</html>
