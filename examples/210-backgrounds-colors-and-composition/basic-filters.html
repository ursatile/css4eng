<!DOCTYPE html>
<html lang="en">
<head>
  <title>Basic Filters</title>
	<style>
		section {
			background: linear-gradient(to bottom right, #900, #009);
			color: white;
			width: 200px;
			height: 100px;
			font-size: 20px;
			text-align: center;
			font-weight: 900;
			display: inline-block;
			font-family: Consolas,'Courier New', Courier, monospace;
		}
	</style>
</head>
<body>
	<section>no filter</section>
	<section style="filter: blur(5px);">
		blur
	</section>
	<section style="filter: sepia();">
		sepia
	</section>
</body>
</html>
