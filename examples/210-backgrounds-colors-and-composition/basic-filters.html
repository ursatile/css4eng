<!DOCTYPE html>
<html lang="en">
<head>
	<title>Basic Filters</title>
	<style>
		section {
			background: linear-gradient(to right, rgb(87, 24, 24), rgb(82, 72, 20), rgb(17, 75, 17), rgb(34, 34, 73), rgb(77, 34, 77));
			color: white;
			width: 200px;
			height: 100px;
			font-size: 20px;
			text-align: center;
			font-weight: 900;
			display: inline-block;
			font-family: Consolas, 'Courier New', Courier, monospace;
			padding-top: 20px;
			margin: 4px;

			span {
				display: block;
				color: white;

				&:nth-child(2) {
					color: black;
				}
			}
	</style>
</head>
<body>
	<section>
		<span>no filter</span>
		<span>no filter</span>
		<span>no filter</span>
	</section>
	<section style="filter: blur(2px);">
		<span>blur</span>
		<span>blur</span>
		<span>blur</span>
	</section>
	<section style="filter: sepia();">
		<span>sepia</span>
		<span>sepia</span>
		<span>sepia</span>
	</section>
	<section style="filter: grayscale(100%);">
		<span>grayscale</span>
		<span>grayscale</span>
		<span>grayscale</span>
	</section>
	<section style="filter: hue-rotate(90deg);">
		<span>hue-rotate</span>
		<span>hue-rotate</span>
		<span>hue-rotate</span>
	</section>
	<section style="filter: invert(100%);">
		<span>invert</span>
		<span>invert</span>
		<span>invert</span>
	</section>
	<section style="filter: brightness(200%);">
		<span>brightness</span>
		<span>brightness</span>
		<span>brightness</span>
	</section>
	<section style="filter: contrast(200%);">
		<span>contrast</span>
		<span>contrast</span>
		<span>contrast</span>
	</section>
	<section style="filter: saturate(50%);">
		<span>saturate</span>
		<span>saturate</span>
		<span>saturate</span>
	</section>
	<section style="filter: opacity(50%);">
		<span>opacity</span>
		<span>opacity</span>
		<span>opacity</span>
	</section>
	<section style="filter: drop-shadow(5px 5px 2px rgba(0,0,0,0.8));">
		<span>drop-shadow</span>
		<span>drop-shadow</span>
		<span>drop-shadow</span>
	</section>
</body>
</html>
