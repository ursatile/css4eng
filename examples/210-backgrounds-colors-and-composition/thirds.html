<!DOCTYPE html>
<html lang="en">
<head>
	<title>Z Index</title>
	<style>
		body,
		html {
			margin: 0;
			padding: 0;
			overflow: hidden;
		}

		div {
			display: inline-block;
			background-color: #ff9;
			width: 33%;
			padding: 0;
			margin: 0;
			height: 8em;
			position: relative;
			box-sizing: border-box;
			}
	</style>
</head>
<body>
	<div>
		<span style="z-index: 1;">z-index: 1</span>
		<span style="z-index: 2;">z-index: 2</span>
		<span style="z-index: 3;">z-index: 3</span>
	</div><div>
		<span style="z-index: 3;">z-index: 3</span>
		<span style="z-index: 2;">z-index: 2</span>
		<span style="z-index: 1;">z-index: 1</span>
	</div><div>
		<span style="z-index: 2;">z-index: 2</span>
		<span style="z-index: 3;">z-index: 3</span>
		<span style="z-index: 1;">z-index: 1</span>
	</div>

</body>
</html>
