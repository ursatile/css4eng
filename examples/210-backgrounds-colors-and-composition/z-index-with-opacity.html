<!DOCTYPE html>
<html lang="en">
<head>
	<title>Z Index</title>
	<style>
		body,
		html {
			margin: 0;
			padding: 0;
		}

		div {
			display: inline-block;
			width: 33%;
			padding: 0;
			height: 10em;
			position: relative;
			box-sizing: border-box;
			margin: 0;

			span {
				opacity: 0.5;
				position: absolute;
				border: 1px solid #000;
				padding: 2px;
				font-family: consolas;
				font-size: 10px;
				display: flex;
				/* Aligns content to the bottom */

				&:nth-child(1) {
					top: 10px;
					left: 10px;
					bottom: 50px;
					right: 30px;
					background-color: rgb(145, 255, 122);
				}

				&:nth-child(2) {
					top: 30px;
					left: 50px;
					bottom: 30px;
					right: 50px;
					background-color: rgb(124, 218, 255);

					&:has(~ [style*="z-index: 1"]) {
						align-items: flex-end;
					}
				}

				&:nth-child(3) {
					top: 50px;
					left: 30px;
					bottom: 10px;
					right: 10px;
					background-color: rgb(216, 132, 255);
					align-items: flex-end;
				}

			}
	</style>
</head>
<body>
	<div>
		<span style="z-index: 1;">z-index: 1</span>
		<span style="z-index: 2;">z-index: 2</span>
		<span style="z-index: 3;">z-index: 3</span>
	</div>
	<div>
		<span style="z-index: 3;">z-index: 3</span>
		<span style="z-index: 2;">z-index: 2</span>
		<span style="z-index: 1;">z-index: 1</span>
	</div>
	<div>
		<span style="z-index: 2;">z-index: 2</span>
		<span style="z-index: 3;">z-index: 3</span>
		<span style="z-index: 1;">z-index: 1</span>
	</div>

</body>
</html>
