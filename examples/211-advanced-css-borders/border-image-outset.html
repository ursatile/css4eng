<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>border-image-slice</title>
	<style>
		* { box-sizing: border-box; }
		body {
			background-color: #000;
			padding: 50px 10px;
			margin: 0;
		}

		section {
			display: flex;
			flex-wrap: wrap;
			gap: 20px;
			justify-content: space-around;
		}

		div {
			background-color: white;
			border-radius: 15px;
			color: #000;
			font-family: Consolas, 'Courier New', Courier, monospace;
			font-size: 0.6em;
			display: flex;
			align-items: center;
			justify-content: center;
			width: 120px;
			height: 120px;
			border-image-source: url(9-slice-chain.png);
			border-width: 40px;
			border-style: solid;
			border-image-slice: 160;
			border-image-width: 40px;
		}
	</style>
</head>
<body>
	<section>
		<div style="border-image-outset: 0">6</div>
		<div style="border-image-outset: 10px; margin: auto 10px;">10px</div>
		<div style="border-image-outset: 20px; margin: auto 20px;">20px</div>
		<div style="border-image-outset: 40px; margin: auto 40px;">40px</div>
	</section>
</body>
</html>
