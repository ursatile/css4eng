<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>border-radius</title>
	<style>
		* { box-sizing: border-box; }
		div {
			border: 2px solid royalblue;
			background-color: gold;
			padding: 30px 10px;
			width: 33vw;
			float: left;
			margin: 5px;
			font-family: Consolas, 'Courier New', Courier, monospace;
			text-align: center;
		}
		</style>
</head>
<body>
	<div style="border-radius: 5px;">border-radius: 5px;</div>
	<div style="border-radius: 25px;">border-radius: 25px;</div>
	<div style="border-radius: 0 5px 20px 50px;">border-radius: 0 5px 20px 50px;</div>
	<div style="border-radius: 20px / 50px;">border-radius: 20px / 50px;</div>
</body>
</html>
