<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Multiple 2d Transforms</title>
	<style>
		* { box-sizing: border-box; }

		body {
			margin: 0;
			padding: 10px;
			height: 100vh;
			min-height: 400px;
			width: 100vw;
			display: grid;
			gap: 10px;
			grid-template-rows: repeat(1, 1fr 3vh);
			grid-template-columns: 1fr, 1fr, 1fr;
			grid-auto-flow: column;
		}

		pre {
			display: flex;
			align-items: center;
			justify-content: center;
			margin: 0;
			padding: 0;
		}

		div {
			display: flex;
			align-items: center;
			justify-content: center;
			background: repeating-conic-gradient(
						transparent 0 90deg,
						royalblue 90deg 180deg,
						transparent 180deg 270deg,
						royalblue 270deg 360deg
					)
					top left / 10px 10px,
				linear-gradient(
					transparent 0 calc(50% - 0.5px),
					white calc(50% - 1px) calc(50% + 1px),
					transparent calc(50% + 0.5px)
				),
				linear-gradient(
					to right,
					royalblue 0 calc(50% - 0.5px),
					white calc(50% - 0.5px) calc(50% + 0.5px),
					royalblue calc(50% + 0.5px)
				);
			font-size: 10vw;
		}
	</style>
</head>
<body>
	<div><span style="scale: 1 2">😎</span></div>
	<pre>scale: 1 2;</pre>
	<div><span style="rotate: 45deg">😎</span></div>
	<pre>rotate: 45deg;</pre>
	<div><span style="translate: 12vw 5vw">😎</span></div>
	<pre>translate: 12vw 5vw</pre>
</body>
</html>
