<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Minimal 3d Transform</title>
	<style>
		@import url('../styles/raleway.css');
		* { box-sizing: border-box; }

		body,
		html {
			margin: 0;
			padding: 0;
		}

		body {
			height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			perspective: 1500px;
		}
		div {
			font-size: 10vw;
			font-weight: 900;
			color: gold;
			background-color: royalblue;
			padding: 20px;
			transform: rotateY(65deg);
		}
	</style>
</head>
<body>
	<div>CSS just went 3D!</div>
</body>
</html>
