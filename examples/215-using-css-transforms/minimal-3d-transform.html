<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Minimal 3d Transform</title>
	<style>
		@import url("../styles/raleway.css");
		* { box-sizing: border-box; }

		body,
		html {
			margin: 0;
			padding: 0;
		}

		body {
			padding: 10px;
			display: flex;
			flex-direction: column;
			justify-content: center;
			gap: 10px;
			height: 100vh;
			min-height: 400px;
			perspective: 80vw;
		}

		div {
			background-color: purple;
			color: white;
			border-radius: 10px;
			font-size: 7vw;
			font-weight: 900;
			padding: 20px;
			&:nth-of-type(1) { text-align: left; transform: rotateY(65deg); }
			&:nth-of-type(2) { text-align: right; transform: rotateY(-65deg); }
		}
	</style>
</head>
<body>
	<div>The future's so bright...</div>
	<div>...I gotta wear shades!</div>
</body>
</html>
