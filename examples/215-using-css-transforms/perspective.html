<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Perspective</title>
	<style></style>
	<style>
		* { box-sizing: border-box; }

		body,
		html {
			margin: 0;
			padding: 0;
		}
		body {
			transform-style: preserve-3d;
			width: 100vw;
			height: 100vh;
			display: flex;
			article {
				transform-style: preserve-3d;
				outline: 1px solid orange;
				flex: 1 1 50vw;
				height: 300px;
				display: flex;
				align-items: center;
				justify-content: center;
				perspective: 100px;
				perspective-origin: 50% 50%;
				section {
					transform-style: preserve-3d;
					position: relative;
					left: -50px;
					top: -50px;
					div {
						position: absolute;
						top: 0;
						left: 0;
						width: 100px;
						height: 100px;
						border: 2px solid #000;
						border-radius: 5px;
					}
					div.front {
						background-color: hsl(0 100% 70% / 0.5);
						transform: translateZ(50px);
					}
					div.back {
						background-color: hsl(60 100% 70% / 0.5);
						transform: translateZ(-50px);
					}
					div.left { background-color: hsl(120 100% 70% / 0.5); }
					div.right { background-color: hsl(180 100% 70% / 0.5); }
					div.top { background-color: hsl(240 100% 70% / 0.5); }
					div.bottom { background-color: hsl(300 100% 70% / 0.5); }
				}
			}
		}
	</style>
</head>
<body>
	<article>
		<section>
			<div class="front">FRONT</div>
			<div class="back">BACK</div>
			<!-- <div class="left">LEFT</div>
<div class="right">RIGHT</div>
<div class="top">TOP</div>
<div class="bottom">BOTTOM</div> -->
		</section>
	</article>
</body>
</html>
