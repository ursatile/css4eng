<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Perspective</title>
	<style></style>
	<style>
		@import url('../styles/raleway.css');
		* { box-sizing: border-box; }

		body,
		html {
			margin: 0;
			padding: 0;
		}
		@keyframes spin {
			0% { transform: none; }
			100% { transform:rotateY(360deg); }
			/* 0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
			16.67% { transform: rotateX(180deg) rotateY(45deg); }
			33.33% { transform: rotateX(360deg) rotateY(90deg); }
			50% { transform: rotateY(180deg) rotateZ(50deg); }
			66.67% { transform: rotateY(360deg) rotateZ(90deg); }
			83.33% { transform: rotateZ(180deg); }
			100% { transform: rotateZ(360deg); } */
		}
		body {
			transform-style: preserve-3d;
			width: 100vw;
			height: 100vh;
			display: flex;
			article {
				transform-style: preserve-3d;
				outline: 1px solid orange;
				flex: 1 1 50vw;
				height: 300px;
				display: flex;
				align-items: center;
				justify-content: center;
				perspective: 1000px;
				perspective-origin: 50% 50%;
				section {
					transform-origin: 50px 50px 50px;
					animation: spin 10s linear infinite;
					transform-style: preserve-3d;
					position: relative;
					left: -50px;
					top: -50px;
					div {
						font-weight: bold;
						font-size: 1.2rem;
						position: absolute;
						top: 50px;
						left: 50px;
						width: 100px;
						height: 100px;
						border: 2px solid #000;
						border-radius: 10px;
						display: flex;
						align-items: center;
						justify-content: center;
					}
					div.front {
						background-color: hsl(0 100% 70% / 0.8);
						transform: translateZ(50px);
					}
					div.back {
						background-color: hsl(60 100% 70% / 0.8);
						transform: translateZ(-50px) rotateY(180deg);
					}
					div.left {
						background-color: hsl(120 100% 70% / 0.8);
						transform: translateX(-50px) rotateY(-90deg);
					}
					div.right {
						background-color: hsl(180 100% 70% / 0.8);
						transform: translateX(50px) rotateY(+90deg);
					}
					div.top {
						background-color: hsl(240 100% 70% / 0.8);
						transform: translateY(-50px) rotateX(+90deg);
					}
					div.bottom {
						background-color: hsl(300 100% 70% / 0.8);
						transform: translateY(50px) rotateX(-90deg);
					}
				}
			}
		}
	</style>
</head>
<body>
	<article>
		<section>
			<div class="front">FRONT</div>
			<div class="back">BACK</div>
			<div class="left">LEFT</div>
			<div class="right">RIGHT</div>
			<div class="top">TOP</div>
			<div class="bottom">BOTTOM</div>
		</section>
	</article>
</body>
</html>
