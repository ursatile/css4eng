<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Transform List Multiple Properties Composite Transforms</title>
	<style>
		body {
			* { box-sizing: border-box; }

			display: flex;
			gap: 10px;
			padding: 10px;
			div {
				font-size: 4rem;
				background-color: royalblue;
				flex: 1 1 25vw;
				height: 200px;
				display: flex;
				align-items: center;
				justify-content: center;
			}
		}

		span#example1 {	transform: rotate(45deg) translate(-100px) scale(2);	}

	</style>
</head>
<body>
	<div><span id="example1">😎</span></div>
	<div><span id="example2">😎</span></div>
	<div><span id="example3">😎</span></div>
	<div><span id="example4">😎</span></div>
</body>
</html>
