<!DOCTYPE html>
<html lang="en">
<head>
	<title>Duotone Background</title>
	<style>
		html {
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
		}
		main {
			display: flex;
			gap: 10px;
			justify-content: space-between;
		}

		section {

			color: #fff;
			align-items: flex-end;
			padding: 2vw;
			box-sizing: border-box;
			font-weight: 900;
			font-size: 4vw;
			line-height: 0.9em;
			display: flex;
			width: 30vw;
			height: 30vw;
			background-blend-mode: color, saturation;
			background-position: center;
			background-size: cover;
		}

		section.blues {
			background-image:
				linear-gradient(royalblue),
				linear-gradient(black),
				url(dominik-scythe-XV9F-gfmThs-unsplash.jpg);
		}

		section.jazz {
			background-image:
				linear-gradient(crimson),
				linear-gradient(black),
				url(reno-laithienne-MGfDE60G0-M-unsplash.jpg);
		}

		section.rock {
			background-image:
				linear-gradient(purple),
				linear-gradient(black),
				url(adam-gritco-eZaO39RrjxU-unsplash.jpg);
		}
		footer {
			margin: 10px auto;
			font-size: 10px;
		}
	</style>
</head>
<body>
	<main>
		<section class="blues">
			blues<br>
			classics
		</section>
		<section class="jazz">
			jazz<br>
			classics
		</section>
		<section class="rock">
			rock<br>
			classics
		</section>
	</main>
	<footer>
		Photos: <a
			href="https://unsplash.com/@drscythe?utm_content=creditCopyText&utm_medium=referral&utm_source=unsplash">Dominik
			Scythe</a> on <a
			href="https://unsplash.com/photos/brown-jazz-guitar-XV9F-gfmThs?utm_content=creditCopyText&utm_medium=referral&utm_source=unsplash">Unsplash</a>
			&bull;
		<a
			href="https://unsplash.com/@renolaithienne?utm_content=creditCopyText&utm_medium=referral&utm_source=unsplash">Reno
			Laithienne</a> on <a
			href="https://unsplash.com/photos/person-in-white-dress-shirt-holding-saxophone-MGfDE60G0-M?utm_content=creditCopyText&utm_medium=referral&utm_source=unsplash">Unsplash</a>
			&bull;
		<a
			href="https://unsplash.com/@adamgritco?utm_content=creditCopyText&utm_medium=referral&utm_source=unsplash">Adam
			Gritco</a> on <a
			href="https://unsplash.com/photos/a-man-holding-a-guitar-in-his-hands-eZaO39RrjxU?utm_content=creditCopyText&utm_medium=referral&utm_source=unsplash">Unsplash</a>
	</footer>
</body>
</html>
