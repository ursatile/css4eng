<!DOCTYPE html>
<html lang="en">
<head>
	<title>Stacking Contexts</title>
	<style>
		body {
			background: #999;
			display: flex;
		}

		article {
			width: 25vw;
		}

		section {
			font-family: Consolas, 'Courier New', Courier, monospace;
			font-size: 0.7rem;
			width: 21vw;
			box-sizing: border-box;
			height: 14vw;
			border: 1px solid #000;
			padding: 0.1rem;
			position: relative;

			&:nth-child(1) {
				background-color: white;
			}

			&:nth-child(2) {
				left: 3vw;
				top: -13vw;
				background-color: black;
				color: white;
				justify-content: flex-end;
				align-items: flex-end;
				display: flex;
				div {
					color: black;
					justify-content: flex-end;
					align-items: flex-end;
					background-color: gold;
				}
			}

			div {
				border: 1px solid #000;
				width: 6vw;
				height: 6vw;
				position: absolute;
				box-sizing: border-box;
				padding: 0.1em 0.3em;
				display: flex;
				background-color: royalblue;
			}

			div:nth-child(1) {
				left: 2vw;
				top: 6vw;
			}

			div:nth-child(2) {
				left: 4vw;
				top: 4vw;
			}

			div:nth-child(3) {
				left: 6vw;
				top: 2vw;
			}
		}
	</style>
</head>
<body>
	<article>
		<section>
			(no z-index)
			<div style="z-index: 2;">2</div>
			<div style="z-index: 4;">4</div>
			<div style="z-index: 6;">6</div>
		</section>
		<section>
			(no z-index)
			<div style="z-index: 3;">3</div>
			<div style="z-index: 5;">5</div>
			<div style="z-index: 7;">7</div>
		</section>
	</article>
	<article>
		<section style="z-index: 1;">
			z-index: 1;
			<div style="z-index: 2;">2</div>
			<div style="z-index: 4;">4</div>
			<div style="z-index: 6;">6</div>
		</section>
		<section>
			(no z-index)
			<div style="z-index: 3;">3</div>
			<div style="z-index: 5;">5</div>
			<div style="z-index: 7;">7</div>
		</section>
	</article>
	<article>
		<section style="z-index: 1;">
			z-index: 1;
			<div style="z-index: 2;">2</div>
			<div style="z-index: 4;">4</div>
			<div style="z-index: 6;">6</div>
		</section>
		<section style="z-index: 2;">
			z-index: 2;
			<div style="z-index: 3;">3</div>
			<div style="z-index: 5;">5</div>
			<div style="z-index: 7;">7</div>
		</section>
	</article>
		<article>
		<section style="z-index: 1;">
			z-index: 1;
			<div style="z-index: 2;">2</div>
			<div style="z-index: 4;">4</div>
			<div style="z-index: 6;">6</div>
		</section>
		<section style="z-index: 2;">
			z-index: 2;
			<div style="z-index: 3;">3</div>
			<div style="z-index: 5;">5</div>
			<div style="z-index: 7;">7</div>
		</section>
	</article>

</body>
</html>
