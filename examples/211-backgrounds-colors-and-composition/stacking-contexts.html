<!DOCTYPE html>
<html lang="en">
<head>
	<title>Stacking Contexts</title>
	<style>
		body {
			background: #999;
			display: flex;
		}

		article {
			width: 25vw;
		}

		section {
			font-family: Consolas, 'Courier New', Courier, monospace;
			font-size: 0.7rem;
			width: 18vw;
			height: 21vw;
			border: 1px solid #000;
			position: relative;

			&:nth-child(1) {
				background-color: white;
			}

			&:nth-child(2) {
				left: 3vw;
				top: -20vw;
				background-color: black;
				color: white;
				justify-content: flex-end;
				align-items: flex-end;
				display: flex;
				div {
					color: black;
					justify-content: flex-end;
					align-items: flex-end;
				}
			}

			div {
				border: 1px solid #000;
				width: 9vw;
				height: 9vw;
				position: absolute;
				box-sizing: border-box;
				padding: 0.1em 0.3em;
				display: flex;
			}

			div:nth-child(1) {
				left: 15vw;
				top: 6vw;
				background-color: magenta;
			}

			div:nth-child(2) {
				left: 9vw;
				top: 12vw;
				background-color: cyan;
			}

			div:nth-child(3) {
				left: 3vw;
				top: 18vw;
				background-color: yellow;
			}
		}
	</style>
</head>
<body>
	<article>
		<section>
			(no z-index)
			<div style="z-index: 2; background-color: #f00;">2</div>
			<div style="z-index: 4; background-color: #f00;">4</div>
			<div style="z-index: 6; background-color: #f00;">6</div>
		</section>
		<section>
			(no z-index)
			<div style="z-index: 3; background-color: #ff0;">8</div>
			<div style="z-index: 5; background-color: #ff0;">10</div>
			<div style="z-index: 7; background-color: #ff0;">12</div>
		</section>
	</article>
