<!DOCTYPE html>
<html lang="en">
<head>
	<title>Stacking Contexts</title>
	<script>
		let shuffled = true;
		document.addEventListener("click", function () {
			document.querySelectorAll("section.demo").forEach(el => {
				if (shuffled) {
					el.style.top = "0px";
				} else {
					el.style.top = "calc(4px + -1 * (18vw + 24px))";
				}
			});
			shuffled = !shuffled;

		});

	</script>
	<style>
		body {
			background: #000;
			display: flex;
		}

		article {
			width: 25vw;
		}

		section {
			font-family: Consolas, 'Courier New', Courier, monospace;
			font-size: 12px;
			width: 20vw;
			height: calc(18vw + 24px);
			border: 1px solid #000;
			box-sizing: border-box;
			padding: 0.1rem;
			margin-bottom: 1rem;
			position: relative;

			&:nth-child(1) {
				background-color: skyblue;
			}

			&:nth-child(2) {
				left: 4vw;
				top: calc(4px + -1 * (18vw + 24px));
				transition: top 2s;

				background-color: #ff9;
				justify-content: flex-end;
				align-items: flex-end;
				display: flex;

				div {
					color: black;
					justify-content: flex-end;
					align-items: flex-end;
					background-color: #fc0;
				}
			}

			div {
				border: 1px solid #000;
				width: 9vw;
				height: 9vw;
				position: absolute;
				box-sizing: border-box;
				padding: 0.1em 0.3em;
				display: flex;
				background-color: royalblue;
			}

			div:nth-child(1) {
				left: 2vw;
				top: 9vw;
			}

			div:nth-child(2) {
				left: 5vw;
				top: 6vw;
			}

			div:nth-child(3) {
				left: 8vw;
				top: 3vw;
			}
		}
	</style>
</head>
<body>
	<article>
		<section>
			(no z-index)
			<div style="z-index: 2;">2</div>
			<div style="z-index: 6;">6</div>
			<div style="z-index: 10;">10</div>
		</section>
		<section class="demo">
			(no z-index)
			<div style="z-index: 4;">4</div>
			<div style="z-index: 8;">8</div>
			<div style="z-index: 12;">12</div>
		</section>
	</article>
	<article>
		<section style="z-index: 7;">
			z-index: 7;
			<div style="z-index: 2;">2</div>
			<div style="z-index: 6;">6</div>
			<div style="z-index: 10;">10</div>
		</section>
		<section class="demo">
			(no z-index)
			<div style="z-index: 4;">4</div>
			<div style="z-index: 8;">8</div>
			<div style="z-index: 12;">12</div>
		</section>
	</article>
	<article>
		<section style="z-index: 1;">
			z-index: 1;
			<div style="z-index: 2;">2</div>
			<div style="z-index: 6;">6</div>
			<div style="z-index: 10;">10</div>
		</section>
		<section class="demo" style="z-index: 2;">
			z-index: 2;
			<div style="z-index: 4;">4</div>
			<div style="z-index: 8;">8</div>
			<div style="z-index: 12;">12</div>
		</section>
	</article>
	<article>
		<section style="z-index: 2;">
			z-index: 2;
			<div style="z-index: 2;">2</div>
			<div style="z-index: 6;">6</div>
			<div style="z-index: 10;">10</div>
		</section>
		<section class="demo" style="z-index: 1;">
			z-index: 1;
			<div style="z-index: 4;">4</div>
			<div style="z-index: 8;">8</div>
			<div style="z-index: 12;">12</div>
		</section>
	</article>
</body>
</html>
