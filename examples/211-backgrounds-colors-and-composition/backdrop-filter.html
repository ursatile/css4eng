<!DOCTYPE html>
<html lang="en">
<head>
	<title>Backdrop Filter</title>
	<style>
		body {
			width: 100vw;
			height: 200vh;
			overflow-x: hidden;
			background-image: url(josh-soto-M76ZhVCMtYw-unsplash.jpg);
			background-size: cover;
			background-position: center;
		}

		main {
			position: fixed;
			display: flex;
			flex-wrap: wrap;
			justify-content: space-around;
			gap: 1rem;
		}

		div {
			box-sizing: border-box;
			width: 30vw;
			height: 7rem;
			font-family: Consolas, 'Courier New', Courier, monospace;
			display: inline-block;
			padding: 1em;
			border: 5px solid #000;
			color: #fff;

			code {
				background-color: #000;
				color: #fff;
				padding: 5px;
				border-radius: 3px;
			}


			&:nth-child(1) {
				backdrop-filter: invert(0.8);
			}

			&:nth-child(2) {
				backdrop-filter: grayscale();
			}

			&:nth-child(3) {
				backdrop-filter: blur(10px);
			}

			&:nth-child(4) {
				backdrop-filter: hue-rotate(180deg);
			}

			&:nth-child(5) {
				backdrop-filter: saturate(0.5);
			}

			&:nth-child(6) {
				backdrop-filter: contrast(0.2);
			}

			&:nth-child(7) {
				backdrop-filter: sepia(1);
			}

			&:nth-child(8) {
				backdrop-filter: brightness(0.2);
			}

			&:nth-child(9) {
				backdrop-filter: brightness(5.0);
			}
	</style>
</head>
<body>
	<main>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
		<div></div>
	</main>
	Photo by <a href="https://unsplash.com/@josh">Josh
		Soto</a> on <a href="https://unsplash.com/photos/M76ZhVCMtYw">Unsplash</a>

	<script>
		function ready(fn) {
			if (document.readyState !== 'loading') return (fn());
			document.addEventListener('DOMContentLoaded', fn);
		}

		ready(() => document.querySelectorAll("div").forEach(div => {
			div.innerHTML = "<code>" + getComputedStyle(div).backdropFilter + "</code>";
		}));
	</script>
</body>
</html>
