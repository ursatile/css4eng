<!DOCTYPE html>
<html lang="en">
<head>
	<title>Backdrop Filter</title>
	<style>
		body {
			width: 100vw;
			height: 100vh;
			overflow: hidden;
			background-image: url(hua-thun-ho-90qdd1mgB0Y-unsplash.jpg);
			background-size: cover;
			display: flex;
			justify-content: space-between;
		}

		div {
			font-family: Consolas, 'Courier New', Courier, monospace;
			display: inline-block;
			padding: 1em;
			border: 5px solid #fff;
			color: #fff;

			code {
				background-color: #0009;
				color: #fff;
				padding: 5px;
				border-radius: 3px;
			}


			&:nth-child(1) {
				backdrop-filter: invert(0.8);
			}

			&:nth-child(2) {
				backdrop-filter: grayscale();
			}

			&:nth-child(3) {
				backdrop-filter: blur(5px);
			}

			&:nth-child(4) {
				backdrop-filter: hue-rotate(180deg);
			}

			&:nth-child(5) {
				backdrop-filter: saturate(0.2);
			}

			&:nth-child(6) {
				backdrop-filter: contrast(0.2);
			}

			&:nth-child(7) {
				backdrop-filter: sepia(1);
			}

			&:nth-child(8) {
				backdrop-filter: brightness(0.2);
			}
	</style>
</head>
<body>
	<div></div>
	<div></div>
	<div></div>
	<div></div>
	<div></div>
	<div></div>
	<div></div>
	<div></div>
	<script>
		function ready(fn) {
			if (document.readyState !== 'loading') {
				fn();
			} else {
				document.addEventListener('DOMContentLoaded', fn);
			}
		}

		ready(() => document.querySelectorAll("div").forEach(div => {
			div.innerHTML = "<code>" + getComputedStyle(div).backdropFilter + "</code>";
		}));
	</script>
</body>
</html>
