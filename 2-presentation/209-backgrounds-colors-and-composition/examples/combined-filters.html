<!DOCTYPE html>
<html lang="en">
<head>
	<title>Combined Filters</title>
	<style>

		p {
			margin: 2vw;
		}

		div {
			display: inline-block;
			width: 21vw;
			height: 20vw;
			margin: 0 1vw;
			outline: 2px solid #000;
			background-image: url(david-clode-Ue2tcqeomdw-unsplash.jpg);
			background-size: cover;
			background-position: center;

			&:nth-child(2) {
				filter: saturate(0.2) contrast(50) blur(0.2vw);
			}

			&:nth-child(3) {
				filter: blur(0.2vw) contrast(50) saturate(0.2);
			}

			&:nth-child(4) {
				filter: blur(0.2vw) saturate(0.2) contrast(50);
			}
		}
	</style>
</head>
<body>
	<div></div>
	<div></div>
	<div></div>
	<div></div>
	<p>
		Photo by <a href="https://unsplash.com/@davidclode">David
			Clode</a> on <a
			href="https://unsplash.com/photos/Ue2tcqeomdw">Unsplash</a>
	</p>

</body>
</html>
