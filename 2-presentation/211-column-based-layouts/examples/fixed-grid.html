<!DOCTYPE html>
<html lang="en">
<head>
	<title>960 Grid Using Floats</title>
	<link rel="stylesheet" href="fixed-grid.css">
	<style>
		.container {
			background: repeating-linear-gradient(to right,
				#ccf 0 10px,
				#fcc  10px 70px,
				#ccf  70px 80px);
		}
		[class*="col-"] {
			margin-top: 10px;
			padding: 2px;
			font-family: Consolas;
			text-align: center;
			background-color: #999;
		}
	</style>
</head>
<body>
	<div class="container">
		<div class="row">
			<div class="col-1">col-1</div><div class="col-1">col-1</div>
			<div class="col-1">col-1</div><div class="col-1">col-1</div>
			<div class="col-1">col-1</div><div class="col-1">col-1</div>
			<div class="col-1">col-1</div><div class="col-1">col-1</div>
			<div class="col-1">col-1</div><div class="col-1">col-1</div>
			<div class="col-1">col-1</div><div class="col-1">col-1</div>
		</div>
		<div class="row">
			<div class="col-3">col-3</div>
			<div class="col-3">col-3</div>
			<div class="col-3">col-3</div>
			<div class="col-3">col-3</div>
		</div>

		<div class="row">
			<div class="col-4">col-4</div>
			<div class="col-4">col-4</div>
			<div class="col-4">col-4</div>
		</div>
		<div class="row">
			<div class="col-6">col-6</div>
			<div class="col-6">col-6</div>
		</div>
		<div class="row">
			<div class="col-12">col-12</div>
		</div>
		<div class="row">
			<div class="col-1">col-1</div>
			<div class="col-11">col-11</div>
		</div>
		<div class="row">
			<div class="col-2">col-2</div>
			<div class="col-10">col-10</div>
		</div>
		<div class="row">
			<div class="col-3">col-3</div>
			<div class="col-9">col-9</div>
		</div>
		<div class="row">
			<div class="col-4">col-4</div>
			<div class="col-8">col-8</div>
		</div>
		<div class="row">
			<div class="col-5">col-5</div>
			<div class="col-7">col-7</div>
		</div>
	</div>
</body>
</html>
