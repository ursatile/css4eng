<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Multiple 2d Transforms</title>
	<style>
		* { box-sizing: border-box; }

		body {
			margin: 0;
			padding: 10px;
			height: 100vh;
			min-height: 600px;
			width: 100vw;
			display: grid;
			gap: 10px;
			grid-template-rows: repeat(2, 1fr 3vh);
			grid-template-columns: 1fr, 1fr, 1fr;
			grid-auto-flow: column;
		}

		pre {
			display: flex;
			align-items: center;
			justify-content: center;
			margin: 0;
			padding: 0;
		}

		@keyframes rotate-then-scale {
			0% { transform: none; }
			50% { transform: rotate(90deg); }
			100% { transform: scale(1, 2) rotate(90deg); }
		}

		@keyframes scale-then-rotate {
			0% { transform: none; }
			50% { transform: scale(1, 2); }
			100% { transform: rotate(90deg) scale(1, 2); }
		}

		@keyframes translate-then-rotate {
			0% { transform: none; }
			50% { transform: translate(12vw); }
			100% { transform: rotate(45deg) translate(12vw); }
		}

		@keyframes rotate-then-translate {
			0% { transform: none; }
			50% { transform: rotate(45deg); }
			100% { transform: translate(12vw) rotate(45deg); }
		}
		div {
			display: flex;
			align-items: center;
			justify-content: center;
			background: repeating-conic-gradient(
						transparent 0 90deg,
						royalblue 90deg 180deg,
						transparent 180deg 270deg,
						royalblue 270deg 360deg
					)
					top left / 10px 10px,
				linear-gradient(
					transparent 0 calc(50% - 0.5px),
					white calc(50% - 0.5px) calc(50% + 0.5px),
					transparent calc(50% + 0.5px)
				),
				linear-gradient(
					to right,
					royalblue 0 calc(50% - 0.5px),
					white calc(50% - 0.5px) calc(50% + 0.5px),
					royalblue calc(50% + 0.5px)
				);
			font-size: 10vw;

			span { animation-delay: 0.2s; }

			&:hover {
				span[style="transform: rotate(90deg) scale(1, 2)"] {
					animation: scale-then-rotate 2s;
				}
				span[style="transform: scale(1, 2) rotate(90deg)"] {
					animation: rotate-then-scale 2s;
				}
				span[style="transform: rotate(45deg) translate(12vw)"] {
					animation: translate-then-rotate 2s;
				}
				span[style="transform: translate(12vw) rotate(45deg)"] {
					animation: rotate-then-translate 2s;
				}
			}
		}
	</style>
</head>
<body>
	<div><span style="transform: rotate(90deg) scale(1, 2)">😎</span></div>
	<pre>transform: rotate(90deg) scale(1, 2);</pre>
	<div><span style="transform: scale(1, 2) rotate(90deg)">😎</span></div>
	<pre>transform: scale(1, 2) rotate(90deg);</pre>
	<div><span style="transform: rotate(45deg) translate(12vw)">😎</span></div>
	<pre>transform: rotate(45deg) translate(12vw)</pre>
	<div><span style="transform: translate(12vw) rotate(45deg)">😎</span></div>
	<pre>transform: translate(12vw) rotate(45deg)</pre>
</body>
</html>
