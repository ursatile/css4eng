<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>preserve-3d</title>
	<style>
		body {
			padding: 2vw;

			article {
				&:not(:last-of-type) { margin-bottom: 5vw; }

				transform: none;
				flex: 1 1 30vw;
				height: 18vw;
				background-color: #000c;
				display: flex;
				justify-content: center;
				gap: 1vw;
				padding: 20px;

				&:hover {
					div { transform: none !important; }
				}

				div {
					transform-style: preserve-3d;
					transition: transform 1s;
					border: 2px solid black;
					border-radius: 10px;
					display: flex;
					flex-direction: column;
					align-items: center;
					justify-content: center;
					font-family: Consolas, 'Courier New', Courier, monospace;
					aspect-ratio: 1;
					font-size: 8vw;

					pre { font-size: 1vw; }
					&:nth-of-type(1) { background-color: gold; }
					&:nth-of-type(2) { background-color: crimson; }
					&:nth-of-type(3) { background-color: royalblue; }
				}
			}
		}
	</style>

</head>
<body>
	<article style="perspective: 100vw;">
		<div style="transform: translateZ(0px);">🐄</div>
		<div style="transform: translateZ(30vw);">🐈</div>
		<div style="transform: translateZ(0px);">🪿</div>
	</article>
	<article style="perspective: 100vw; transform-style: preserve-3d;">
		<div style="transform: translateZ(0px);">🐄</div>
		<div style="transform: translateZ(30vw);">🐈</div>
		<div style="transform: translateZ(0px);">🪿</div>
	</article>
</body>
<script>
	document.querySelectorAll("div").forEach(div => {
		div.innerHTML += "<pre>" + div.getAttribute("style").replace(/transform: /, '') + "</pre>";
	});
</script>
</html>
