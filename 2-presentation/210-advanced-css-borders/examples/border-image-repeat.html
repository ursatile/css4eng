<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>border-image-slice</title>
	<style>
		* { box-sizing: border-box; }
		body {
			background-color: #000;
			margin: 0;
		}

		section {
			display: flex;
			flex-wrap: wrap;
			gap: 20px;
			justify-content: space-around;
		}

		div {
			background-color: white;
			border-radius: 15px;
			color: #000;
			font-family: Consolas, 'Courier New', Courier, monospace;
			font-size: 0.6em;
			display: flex;
			align-items: center;
			justify-content: center;
			width: 45vw;
			height: 140px;
			border-image-source: url(9-slice-chain.png);
			border-width: 40px;
			border-style: solid;
			border-image-slice: 160;
			border-image-width: 40px;
		}
	</style>
</head>
<body>
	<section>
		<div style="border-image-repeat: stretch;">border-image-repeat: stretch</div>
		<div style="border-image-repeat: repeat;">border-image-repeat: repeat</div>
		<div style="border-image-repeat: round;">border-image-repeat: round</div>
		<div style="border-image-repeat: space;">border-image-repeat: space</div>
	</section>
</body>
</html>
