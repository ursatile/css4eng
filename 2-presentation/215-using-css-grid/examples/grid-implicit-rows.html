<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Grid Template Auto</title>
	<style>
		section {
			display: grid;
			grid-template-columns: 1fr 1fr;
			grid-template-rows: 1fr 1fr;
		}
	</style>

	<style>
		body {
			height: 20rem;
			overflow-y: scroll;
		}

		section {
			gap: 10px;
			padding: 10px;
			height: 15rem;
		}
	</style>
	<link rel="stylesheet" href="grid-demo.css">
</head>
<body>
	<button id="add-an-element-button" href="#">add an element</button>
	<button id="reset-button" href="#">reset</button>
	<section>
	</section>
</body>
<script>
	document.getElementById("add-an-element-button").addEventListener("click", () => {
		const div = document.createElement('div');
		document.querySelector("section").appendChild(div);
		return false;
	});
	document.getElementById("reset-button").addEventListener("click", () => {
		document.querySelector("section").innerHTML = '';
	});

</script>
</html>
