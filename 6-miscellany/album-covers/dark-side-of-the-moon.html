<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Pink Floyd: The Dark Side Of The Moon</title>
	<style>
		:root { --size: min(80vw, 80vh); }
		* { box-sizing: border-box; }

		html {
			background: white;
			display: flex;
			align-items: center;
			justify-content: center;
			height: 100vh;
			background-image: url(Pink-Floyd-Dark-Side-of-the-Moon.webp);
			background-size: var(--size) var(--size);
			background-repeat: no-repeat;
			background-position: center center;
		}

		body {
			&:hover { opacity: 0; }

			opacity: 1;
			margin: 10vw auto;
			width: var(--size);
			height: var(--size);
			display: flex;
			align-items: start;
			justify-content: center;
			overflow: hidden;
			background-image: linear-gradient(165.8deg, #0000 0 42.2%, white 42.5% 42.7%, #0000 43%),

			conic-gradient(from 0deg at -96% 26%,
				#0000 0deg 98.7deg,
				#f01d24 98.8deg 99.6deg,
				#f7821f 99.7deg 100.5deg,
				#fdea03 100.6deg 101.4deg,
				#4bb846 101.5deg 102.4deg,
				#00b6f1 102.5deg 103.2deg,
				#6e69af 103.3deg 104.1deg,
				#0000 104.2deg),
			linear-gradient(black);
			background-size: calc(var(--size) / 2) var(--size),
			calc(var(--size) / 2) var(--size),
			var(--size) var(--size);
			background-position: 0 0,
			calc(var(--size) / 2) 0;
			background-repeat: no-repeat,
			no-repeat;

			div {
				position: relative;
				top: calc(var(--size) / 4.1);
				width: calc(var(--size) / 3.2);
				height: calc(var(--size) / 3.6);
				border-width: 0 calc(var(--size) / 6.4) calc(var(--size) / 3.6) calc(var(--size) / 6.4);
				border-style: solid;
				border-color: transparent transparent rgb(180, 248, 245) transparent;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: flex-start;

				&::before {
					border-width: 0 calc(var(--size) / 7) calc(var(--size) / 3.95) calc(var(--size) / 7);
					position: relative;
					top: calc(var(--size) * 0.018);
					border-style: solid;
					border-color: transparent transparent #012 transparent;
					content: ' ';
					filter: blur(calc(var(--size) * 0.01));
				}

				&::after {
					content: ' ';
					width: calc(var(--size) / 3.2);
					height: calc(var(--size) / 3.6);
					position: absolute;
					z-index: 2;
					background-image:
						conic-gradient(from 0deg at 22% 46.5%,
							#000 0deg 76deg,
							#fff 77deg 100deg,
							#000 101deg 0deg),
						conic-gradient(from 0deg at 50% 0%,
							#000 0deg 150deg,
							#333 150deg 155deg,
							#9990 205deg 210deg,
							#000 210deg 270deg);
					background-blend-mode: multiply;
					mix-blend-mode: screen;
				}
			}
		}
	</style>
</head>
<body>
	<div></div>
</body>
</html>
