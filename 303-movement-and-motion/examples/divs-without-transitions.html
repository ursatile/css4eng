<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Divs Without Transitions</title>
	<style>
		* { box-sizing: border-box; }
		body {
			text-align: center;
			height: 140px;
		}
		div {
			margin: 10px;
			width: 200px;
			height: 70px;
			padding-top: 20px;
			font-size: 1.5rem;
			background-color: crimson;
			color: #fff;
			font-weight: bold;
			display: inline-block;
			vertical-align: top;
			&:nth-of-type(1):hover {
				background-color: royalblue;
			}
			&:nth-of-type(2):hover {
				height: 130px;
			}
			&:nth-of-type(3):hover {
				font-family: Arial, Helvetica, sans-serif;
			}
		}
	</style>
</head>
<body>
	<div>hover over me</div>
	<div>hover over me</div>
	<div>hover over me</div>
</body>
</html>
