<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Simple Keyframes</title>
	<style>
		@keyframes really-cool-animation-demo {
			from {
				background-color: crimson;
			}

			to {
				background-color: royalblue;
			}
		}

		div {
			animation: really-cool-animation-demo 1s;
		}
	</style>
	<style>
		@import url('/styles/raleway.css');
	</style>
</head>
<body>
	<div>ANIMATION DEMO</div>
	<p>
		<a style="text-decoration: none;" href="javascript:window.location.reload()">🔃 reload page</a>
	</p>
</body>
</html>
